<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar check-in — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .review-wrap { max-width: 640px; }
  .review-head { margin-bottom: 22px; }
  .review-head .who { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .review-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; }
  .review-head .wk { font-size: 13px; color: var(--ink-faint); }
  .metas-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin: 14px 0 6px; }
  .metas-editor .m-field { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 15px; background: var(--surface); }
  .metas-editor label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-muted); margin-bottom: 8px; }
  .metas-editor input { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px; font-family: var(--font-mono); font-size: 14px; background: var(--surface); color: var(--ink); }
  .confirm-wrap { text-align: center; padding: 70px 20px; }
  .confirm-wrap .ring { width: 72px; height: 72px; border-radius: 50%; background: var(--brand-tint); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .confirm-wrap h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
  .confirm-wrap p { color: var(--ink-muted); font-size: 13.5px; max-width: 320px; margin: 0 auto 24px; }
  .mini-photo-row { display: flex; gap: 10px; margin-top: 4px; }
  .mini-photo { width: 56px; height: 74px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 8.5px; color: rgba(255,255,255,.7); flex: none; }
  .insight-list { display: flex; flex-direction: column; gap: 10px; }
  .insight-list .row { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .insight-list .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex: none; margin-top: 6px; }
  .focus-input { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 11px 13px; font-family: var(--font-display); font-size: 16px; font-weight: 600; background: var(--surface); color: var(--ink); margin-bottom: 16px; }
  .focus-input:focus { outline: none; border-color: var(--brand); }
  .recent-table { width: 100%; border-collapse: collapse; }
  .recent-table th { text-align: right; font-size: 11px; font-weight: 600; color: var(--ink-faint); padding: 0 0 8px 10px; }
  .recent-table th:first-child, .recent-table td:first-child { text-align: left; padding-left: 0; }
  .recent-table th.now, .recent-table td.now { color: var(--brand); }
  .recent-table td { text-align: right; font-family: var(--font-mono); font-size: 13px; padding: 7px 0 7px 10px; border-top: 1px solid var(--line); }
  .recent-table td.metric-label { font-family: var(--font-body); color: var(--ink-muted); font-size: 12.5px; }
  .visual-evo { display: flex; align-items: center; gap: 16px; }
  .visual-evo .vs-photos { display: flex; gap: 6px; flex: none; }
  .visual-evo .vs-photo { width: 40px; height: 54px; border-radius: 6px; }
  .visual-evo .vs-arrow { color: var(--ink-faint); flex: none; }
  .visual-evo .vs-label { font-size: 11px; color: var(--ink-faint); text-align: center; margin-top: 4px; }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="shell">
  <div id="shell-sidebar"></div>
  <main class="main">
    <div class="main-inner review-wrap">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <a href="dashboard.html" class="btn-ghost btn" style="padding-left:2px;margin-bottom:14px;">&larr; Voltar</a>
      <div id="review-body"></div>
      <div id="review-confirm" style="display:none;"></div>
    </div>
  </main>
</div>

<script src="../assets/js/storage.js?v=5"></script>
<script src="../assets/js/data.js?v=5"></script>
<script src="../assets/js/icons.js?v=5"></script>
<script src="../assets/js/charts.js?v=5"></script>
<script src="../assets/js/nav.js?v=5"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var client = Trackly.getClient(params.get("id") || "joao");
  TracklyNav.mountCoachShell("dashboard", client.id);

  var cur = Trackly.currentWeek(client);
  var color = TracklyNav.colorFor(client);

  if (cur.checkin.status !== "submitted") {
    document.getElementById("review-body").innerHTML =
      '<div class="card card-pad" style="text-align:center;padding:48px 24px;">' +
      '<p class="card-title" style="margin-bottom:6px;">Ainda não há check-in pra revisar</p>' +
      '<p class="card-sub" style="margin-bottom:18px;">' + client.name + ' ainda não enviou o check-in da semana ' + cur.weekNumber + '.</p>' +
      '<a href="cliente.html?id=' + client.id + '" class="btn btn-secondary">Ver perfil do cliente</a></div>';
    return;
  }
  var qa = cur.qa || {};
  var insights = Trackly.checkInInsights(client);
  var suggestedFocus = Trackly.focusLabel(client);

  var qaKeyTracks = { cardioDetalhe: "cardio", performanceTreino: "workouts", digestao: "digestion", emocional: "emotional" };
  var qaLabels = [
    ["dieta", "Como foi a dieta?"],
    ["refeicaoLivre", "Fez a refeição livre? Se sim, qual dia e o que comeu?"],
    ["beliscos", "Houve beliscos de comida fora do plano?"],
    ["cardioDetalhe", "Como foi o cardio? Tempo, dias e tipo."],
    ["performanceTreino", "Como foi sua performance nos treinos?"],
    ["periodoMenstrual", "Está no período menstrual?"],
    ["digestao", "Como foi sua digestão? Idas ao banheiro e estufamento."],
    ["emocional", "Como está seu emocional?"],
    ["substancias", "Uso de substâncias/medicamentos, quando aplicável."],
    ["exame", "Último exame enviado, quando aplicável."]
  ].filter(function (row) { return qa[row[0]] != null && (!qaKeyTracks[row[0]] || Trackly.isTracked(client, qaKeyTracks[row[0]])); });

  var goalIcons = { water: ICONS.drop, sleep: ICONS.moon, workouts: ICONS.dumbbell, cardio: ICONS.run };
  var goalFieldsHtml = Trackly.trackedGoals(cur, client).filter(function (g) { return g.key !== "adherence"; }).map(function (g) {
    return '<div class="m-field"><label>' + goalIcons[g.key] + g.label + (g.unit && g.unit !== "sessões" ? " (" + g.unit + ")" : "") + '</label><input type="number" step="' + (g.key === "workouts" || g.key === "cardio" ? "1" : "0.1") + '" value="' + g.target + '" data-key="' + g.key + '"></div>';
  }).join("");

  var photoAngles = [["front", "FRENTE"], ["back", "COSTAS"], ["side_l", "LAT."]];
  var hue = client.colorVar === "--c1" ? 155 : client.colorVar === "--c2" ? 32 : client.colorVar === "--c3" ? 265 : 205;
  var photosHtml = photoAngles.map(function (a, i) {
    return '<div class="mini-photo" style="background:hsl(' + hue + ',' + (26 + i * 4) + '%,' + (26 + i * 5) + '%);">' + a[1] + '</div>';
  }).join("");

  // Últimas semanas — contexto de tendência antes de decidir
  var recent = Trackly.recentWeeksTable(client, 3);
  var recentTableHtml = recent.weeks.length < 2 ? "" : (
    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<p class="card-title" style="margin-bottom:14px;">Últimas semanas</p>' +
      '<div style="overflow-x:auto;"><table class="recent-table"><thead><tr><th></th>' +
        recent.weeks.map(function (w, i) { return '<th class="' + (i === recent.weeks.length - 1 ? "now" : "") + '">' + (i === recent.weeks.length - 1 ? "Atual" : "S-" + (recent.weeks.length - 1 - i)) + '</th>'; }).join("") +
      '</tr></thead><tbody>' +
      recent.cols.map(function (col) {
        return '<tr><td class="metric-label">' + col.label + '</td>' + recent.weeks.map(function (w, i) {
          return '<td class="' + (i === recent.weeks.length - 1 ? "now" : "") + '">' + col.fmt(w) + '</td>';
        }).join("") + '</tr>';
      }).join("") +
      '</tbody></table></div>' +
    '</div>'
  );

  // Evolução visual — só uma prévia; a comparação completa fica no perfil
  var submittedWeeks = client.weeks.filter(function (w) { return w.checkin.status === "submitted"; });
  var visualEvoHtml = (!Trackly.isTracked(client, "photos") || submittedWeeks.length < 2) ? "" : (function () {
    var prevW = submittedWeeks[submittedWeeks.length - 2];
    function ph(i) { return '<div class="vs-photo" style="background:hsl(' + hue + ',' + (26 + i * 4) + '%,' + (30 + i * 8) + '%);"></div>'; }
    return (
      '<div class="card card-pad" style="margin-bottom:18px;">' +
        '<p class="card-title" style="margin-bottom:14px;">Evolução visual</p>' +
        '<div class="visual-evo">' +
          '<div><div class="vs-photos">' + ph(0) + ph(1) + '</div><div class="vs-label">Semana ' + prevW.weekNumber + '</div></div>' +
          '<span class="vs-arrow">' + ICONS.chevronR + '</span>' +
          '<div><div class="vs-photos">' + ph(2) + ph(3) + '</div><div class="vs-label">Semana ' + cur.weekNumber + ' (atual)</div></div>' +
          '<a href="cliente.html?id=' + client.id + '" style="margin-left:auto;font-size:12.5px;color:var(--brand);font-weight:600;white-space:nowrap;">Ver comparação</a>' +
        '</div>' +
      '</div>'
    );
  })();

  document.getElementById("review-body").innerHTML =
    '<div class="review-head">' +
      '<div class="who"><span class="avatar" style="background:' + color + '">' + client.initials + '</span><h1>' + client.name + '</h1></div>' +
      '<div class="wk">Check-in — Semana ' + cur.weekNumber + ' &nbsp;·&nbsp; recebido ' + Trackly.relativeLabel(cur.checkin.submittedAt) + '</div>' +
    '</div>' +

    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<p class="card-title" style="margin-bottom:14px;">Resumo</p>' +
      '<div class="resumo-strip">' +
        (Trackly.isTracked(client, "weight") ? '<div class="item"><div class="label">Peso</div><div class="value">' + cur.metrics.weight + '<span class="unit">kg</span></div></div>' : "") +
        (Trackly.isTracked(client, "adherence") ? '<div class="item"><div class="label">Dieta</div><div class="value">' + Math.round(cur.metrics.adherence / 10) + '<span class="unit">/10</span></div></div>' : "") +
        (Trackly.isTracked(client, "workouts") ? '<div class="item"><div class="label">Treinos</div><div class="value">' + cur.metrics.workouts + '<span class="unit">/' + cur.metrics.workoutsGoal + '</span></div></div>' : "") +
        (Trackly.isTracked(client, "cardio") ? '<div class="item"><div class="label">Cardio</div><div class="value">' + cur.metrics.cardio + '<span class="unit">/' + cur.metrics.cardioGoal + '</span></div></div>' : "") +
        (Trackly.isTracked(client, "water") ? '<div class="item"><div class="label">Água</div><div class="value">' + cur.metrics.water + '<span class="unit">L</span></div></div>' : "") +
        (Trackly.isTracked(client, "sleep") ? '<div class="item"><div class="label">Sono</div><div class="value">' + cur.metrics.sleep + '<span class="unit">h</span></div></div>' : "") +
      '</div>' +
    '</div>' +

    (insights.length ? (
    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<p class="card-title" style="margin-bottom:12px;">O que mudou</p>' +
      '<div class="insight-list">' + insights.map(function (t) { return '<div class="row"><span class="dot"></span>' + t + '</div>'; }).join("") + '</div>' +
    '</div>'
    ) : "") +

    recentTableHtml +

    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<button class="disclosure-btn" id="qa-toggle">' + ICONS.chevronR + '<span>Ver respostas completas</span></button>' +
      '<div class="disclosure-panel" id="qa-panel">' +
        '<div class="qa-list">' + qaLabels.map(function (row) {
          return '<div class="qa-item"><div class="q">' + row[1] + '</div><div class="a">' + qa[row[0]] + '</div></div>';
        }).join("") + '</div>' +
        (cur.note ? '<div class="qa-item" style="margin-top:16px;"><div class="q">Observação livre</div><div class="a">"' + cur.note + '"</div></div>' : "") +
        (Trackly.isTracked(client, "photos") ? '<div class="qa-item" style="margin-top:16px;"><div class="q">Fotos desta semana</div><div class="mini-photo-row">' + photosHtml + '</div></div>' : "") +
      '</div>' +
    '</div>' +

    visualEvoHtml +

    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<p class="card-title" style="margin-bottom:4px;">O que você quer orientar esta semana?</p>' +
      '<p class="card-sub" style="margin-bottom:16px;">Visível para ' + client.name.split(" ")[0] + ' assim que você enviar.</p>' +
      '<label style="font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px;">Foco da semana</label>' +
      '<input type="text" class="focus-input" id="focus-input" placeholder="Ex.: melhorar consistência do sono" value="' + suggestedFocus + '">' +
      '<label style="font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px;">Orientação</label>' +
      '<div class="field" style="margin-bottom:0;"><textarea id="orientation-input" rows="4" placeholder="Ex.: manter alimentação atual, aumentar água para 3L/dia, dormir pelo menos 7h30...">' + Trackly.suggestOrientation(client) + '</textarea></div>' +
    '</div>' +

    '<div class="card card-pad" style="margin-bottom:22px;">' +
      '<p class="card-title" style="margin-bottom:4px;">Metas da semana</p>' +
      '<p class="card-sub" style="margin-bottom:14px;">Metas de ' + client.name.split(" ")[0] + ' — específicas pra ele(a), não um padrão geral.</p>' +
      '<div class="metas-editor" id="metas-editor">' +
        goalFieldsHtml +
      '</div>' +
    '</div>' +

    '<button class="btn btn-primary btn-lg" id="send-orientation">Enviar orientação</button>';

  document.getElementById("qa-toggle").addEventListener("click", function () {
    this.classList.toggle("open");
    document.getElementById("qa-panel").classList.toggle("open");
    this.querySelector("span").textContent = this.classList.contains("open") ? "Ocultar respostas" : "Ver o que ele respondeu";
  });

  document.getElementById("send-orientation").addEventListener("click", function () {
    var goals = {};
    document.querySelectorAll("#metas-editor input[data-key]").forEach(function (input) {
      goals[input.getAttribute("data-key")] = parseFloat(input.value);
    });
    Trackly.completeOrientation(client.id, {
      focus: document.getElementById("focus-input").value.trim(),
      orientation: document.getElementById("orientation-input").value.trim(),
      goals: goals
    });

    document.getElementById("review-body").style.display = "none";
    var el = document.getElementById("review-confirm");
    el.style.display = "block";
    el.innerHTML =
      '<div class="confirm-wrap"><div class="ring">' + ICONS.check + '</div>' +
      '<h2>Orientação enviada</h2>' +
      '<p>' + client.name.split(" ")[0] + ' vai ver o foco da semana e sua mensagem assim que abrir o app. ✓ Atualizado hoje às ' + Trackly.fmtTime(new Date()) + '.</p>' +
      '<a href="dashboard.html" class="btn btn-primary">Voltar ao dashboard</a></div>';
  });
})();
</script>
</body>
</html>
