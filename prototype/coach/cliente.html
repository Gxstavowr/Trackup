<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css?v=15">
<style>
  .profile-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .profile-who { display: flex; align-items: center; gap: 16px; }
  .profile-who .avatar { width: clamp(42px, 12vw, 52px); height: clamp(42px, 12vw, 52px); font-size: clamp(15px, 4vw, 19px); }
  .profile-who h1 { font-family: var(--font-display); font-size: clamp(1.25rem, 1rem + 1.2vw, 1.5625rem); margin: 0 0 4px; }
  .profile-meta { font-size: 13px; color: var(--ink-muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .profile-meta strong { color: var(--ink); }
  .chart-card .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .chart-card .chart-head h3 { font-size: 14px; margin: 0; font-weight: 600; }
  .compare-select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font-size: 13px; font-family: var(--font-body); }

  /* --- chrome compartilhado dos painéis de trabalho (Treino / Nutrição / Avaliação) --- */
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .panel-head .section-label { margin-bottom: 0; }
  .save-indicator { font-size: 12px; color: var(--brand); font-weight: 600; opacity: 0; transition: opacity .2s; }
  .save-indicator.show { opacity: 1; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .12s; flex: none;
  }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
  .icon-btn.danger:hover { border-color: var(--coral); color: var(--coral); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* --- Treino --- */
  .protocol-name-field { max-width: 420px; margin-bottom: 26px; }
  .day-card { margin-bottom: 18px; }
  .day-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .day-head input[type="text"] { font-family: var(--font-display); font-size: 17px; font-weight: 600; border: none; background: none; color: var(--ink); padding: 4px 2px; width: auto; min-width: 90px; }
  .day-head input[type="text"]:focus { outline: none; border-bottom: 1.5px solid var(--brand); }
  .day-head .dur { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-faint); }
  .day-head .dur input { width: 52px; padding: 5px 7px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 12.5px; background: var(--surface); color: var(--ink); }
  .day-actions { margin-left: auto; display: flex; gap: 4px; }
  .ex-row { display: grid; grid-template-columns: 1.6fr .6fr .6fr .7fr .6fr 1.3fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ex-row:last-of-type { border-bottom: none; }
  .ex-row select, .ex-row input { padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; font-size: 12.5px; background: var(--surface); color: var(--ink); width: 100%; }
  .ex-row .ex-mini-actions { display: flex; gap: 4px; }
  .ex-col-label { font-size: 10.5px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  .ex-head-row { display: grid; grid-template-columns: 1.6fr .6fr .6fr .7fr .6fr 1.3fr auto; gap: 8px; margin-bottom: 2px; }
  /* labels inline por campo, escondidos no desktop (onde ex-head-row já rotula as colunas) —
     mostrados apenas quando a grade colapsa pra 1 coluna, senão os campos ficam sem contexto (TODO §30) */
  .ex-mobile-label { display: none; }

  /* --- Nutrição --- */
  .plan-name-field { max-width: 420px; margin-bottom: 26px; }
  .meal-card { margin-bottom: 18px; }
  .meal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .meal-head input[type="text"].meal-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; border: none; background: none; color: var(--ink); padding: 4px 2px; width: auto; min-width: 90px; }
  .meal-head input[type="text"].meal-name:focus { outline: none; border-bottom: 1.5px solid var(--brand); }
  .meal-head .time { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-faint); }
  .meal-head .time input { width: 68px; padding: 5px 7px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 12.5px; background: var(--surface); color: var(--ink); }
  .meal-actions { margin-left: auto; display: flex; gap: 4px; }
  .mini-block { margin-top: 14px; }
  .mini-block .lbl { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .item-row, .sub-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .item-row input, .sub-row input { padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; font-size: 12.5px; background: var(--surface); color: var(--ink); }
  .item-row input:first-child, .sub-row input { flex: 1; }
  .item-row input:nth-child(2) { width: 90px; flex: none; }
  .sub-row .arrow { color: var(--ink-faint); flex: none; font-size: 12px; }
  .macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .macro-grid .m-field label { font-size: 10.5px; color: var(--ink-faint); font-weight: 600; display: block; margin-bottom: 4px; }
  .macro-grid .m-field input { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; font-size: 12.5px; background: var(--surface); color: var(--ink); }
  .add-mini { font-size: 12px; color: var(--brand); font-weight: 600; background: none; border: none; cursor: pointer; padding: 2px 0; }

  /* --- Avaliação --- */
  .review-wrap { max-width: 640px; }
  .review-head { margin-bottom: 22px; }
  .review-head .wk { font-size: 13px; color: var(--ink-faint); }
  .metas-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin: 14px 0 6px; }
  .metas-editor .m-field { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 15px; background: var(--surface); }
  .metas-editor label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-muted); margin-bottom: 8px; }
  .metas-editor input { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px; font-family: var(--font-mono); font-size: 14px; background: var(--surface); color: var(--ink); }
  .confirm-wrap { text-align: center; padding: 70px 20px; }
  .confirm-wrap .ring { width: clamp(56px, 16vw, 72px); height: clamp(56px, 16vw, 72px); border-radius: 50%; background: var(--brand-tint); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .confirm-wrap h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
  .confirm-wrap p { color: var(--ink-muted); font-size: 13.5px; max-width: 320px; margin: 0 auto 24px; }
  .mini-photo-row { display: flex; gap: 10px; margin-top: 4px; }
  .mini-photo { width: 56px; height: 74px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 8.5px; color: rgba(255,255,255,.7); flex: none; }
  .insight-list { display: flex; flex-direction: column; gap: 10px; }
  .insight-list .row { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .insight-list .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex: none; margin-top: 6px; }
  .focus-input { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 11px 13px; font-family: var(--font-display); font-size: 16px; font-weight: 600; background: var(--surface); color: var(--ink); margin-bottom: 16px; }
  .focus-input:focus { outline: none; border-color: var(--brand); }
  .recent-table { width: 100%; border-collapse: collapse; }
  .recent-table th { text-align: right; font-size: 11px; font-weight: 600; color: var(--ink-faint); padding: 0 0 8px 10px; }
  .recent-table th:first-child, .recent-table td:first-child { text-align: left; padding-left: 0; }
  .recent-table th.now, .recent-table td.now { color: var(--brand); }
  .recent-table td { text-align: right; font-family: var(--font-mono); font-size: 13px; padding: 7px 0 7px 10px; border-top: 1px solid var(--line); }
  .recent-table td.metric-label { font-family: var(--font-body); color: var(--ink-muted); font-size: 12.5px; }

  /* --- Métricas acompanhadas (item 8 do TODO) — mesmo padrão visual dos checkboxes de checkin-config --- */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px 18px; margin: 16px 0 6px; }
  .metrics-check { display: flex; align-items: center; gap: 8px; }
  .metrics-check label { font-size: 13px; font-weight: 500; color: var(--ink-muted); }

  @media (max-width: 768px) {
    .ex-row, .ex-head-row { grid-template-columns: 1fr; }
    .ex-head-row { display: none; }
    .ex-row { gap: 6px; padding: 14px 0; }
    .ex-mobile-label { display: block; font-size: 10.5px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  }
  @media (max-width: 480px) {
    .macro-grid { grid-template-columns: repeat(2, 1fr); }
    .item-row input:nth-child(2) { width: 64px; }
  }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="shell">
  <div id="shell-sidebar"></div>
  <main class="main">
    <div class="main-inner">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <a href="clientes.html" class="btn-ghost btn" style="padding-left:2px;margin-bottom:10px;">&larr; Todos os clientes</a>

      <div class="profile-head">
        <div class="profile-who">
          <span class="avatar" id="p-avatar"></span>
          <div>
            <h1 id="p-name"></h1>
            <div class="profile-meta" id="p-meta"></div>
          </div>
        </div>
        <span class="pill" id="p-status"></span>
      </div>

      <div style="display:flex;gap:40px;margin:18px 0 2px;flex-wrap:wrap;" id="p-hero-stats"></div>

      <div class="tabs" style="margin-top:22px;">
        <button class="tab-btn active" data-tab="resumo">Visão geral</button>
        <button class="tab-btn" data-tab="treino">Treino</button>
        <button class="tab-btn" data-tab="nutricao">Nutrição</button>
        <button class="tab-btn" data-tab="avaliacao">Avaliação</button>
        <button class="tab-btn" data-tab="evolucao">Evolução</button>
        <button class="tab-btn" data-tab="fotos">Fotos</button>
        <button class="tab-btn" data-tab="historico">Histórico</button>
        <button class="tab-btn" data-tab="pagamentos">Pagamentos</button>
      </div>

      <div class="tab-panel active" id="tab-resumo"></div>
      <div class="tab-panel" id="tab-treino"></div>
      <div class="tab-panel" id="tab-nutricao"></div>
      <div class="tab-panel review-wrap" id="tab-avaliacao"></div>
      <div class="tab-panel" id="tab-evolucao"></div>
      <div class="tab-panel" id="tab-fotos"></div>
      <div class="tab-panel" id="tab-historico"></div>
      <div class="tab-panel" id="tab-pagamentos"></div>
    </div>
  </main>
</div>

<script src="../assets/js/storage.js?v=13"></script>
<script src="../assets/js/data.js?v=16"></script>
<script src="../assets/js/icons.js?v=12"></script>
<script src="../assets/js/charts.js?v=13"></script>
<script src="../assets/js/nav.js?v=14"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var client = Trackly.getClient(params.get("id") || "joao");
  TracklyNav.mountCoachShell("clientes", client.id);

  if (!client.weeks.length) {
    document.querySelector(".main-inner").innerHTML =
      '<a href="clientes.html" class="btn-ghost btn" style="padding-left:2px;margin-bottom:14px;">&larr; Todos os clientes</a>' +
      '<div class="card card-pad" style="text-align:center;padding:48px 24px;">' +
      '<p class="card-title" style="margin-bottom:6px;">' + client.name + ' ainda não iniciou o acompanhamento</p>' +
      '<p class="card-sub" style="margin-bottom:18px;">' + (client.inviteStatus === "pending" ? "Envie o convite pra começar." : "Convite enviado — aguardando aceite.") + '</p>' +
      '<a href="clientes.html" class="btn btn-secondary">Voltar pra clientes</a></div>';
    return;
  }

  // aba Fotos some por completo (não fica vazia) quando o aluno não acompanha fotos —
  // reaplicada depois de salvar as métricas, então religar/desligar reflete sem precisar recarregar.
  function syncFotosTab() {
    var fotosBtn = document.querySelector('[data-tab="fotos"]');
    if (fotosBtn) fotosBtn.style.display = Trackly.isTracked(client, "photos") ? "" : "none";
  }
  syncFotosTab();

  var kpi = Trackly.computeKPIs(client);
  var color = TracklyNav.colorFor(client);

  // labels das métricas de client.tracking — mesma copy usada em checkin-config.html (TRACKS_LABELS)
  var TRACKING_LABELS = {
    weight: "Peso", adherence: "Aderência", workouts: "Treinos", cardio: "Cardio",
    water: "Água", sleep: "Sono", digestion: "Digestão", emotional: "Emocional",
    measurements: "Medidas (cintura)", photos: "Fotos"
  };
  var TRACKING_KEYS = Object.keys(Trackly.TRACKING_DEFAULT);

  document.getElementById("p-avatar").textContent = client.initials;
  document.getElementById("p-avatar").style.background = color;
  document.getElementById("p-name").textContent = client.name;
  var cur0 = Trackly.currentWeek(client);
  var refWeek0 = cur0.orientation ? cur0 : (function () {
    for (var i = client.weeks.length - 1; i >= 0; i--) if (client.weeks[i].orientation) return client.weeks[i];
    return cur0;
  })();
  document.getElementById("p-meta").innerHTML =
    (client.age && client.heightCm ? '<span>' + client.age + ' anos · ' + (client.heightCm / 100).toFixed(2).replace(".", ",") + ' m</span><span>·</span>' : '') +
    '<span>' + client.objective + '</span><span>·</span><span>Foco: ' + Trackly.focusLabelFromOrientation(client, refWeek0) + '</span>';
  // o pill de status é recalculado sempre que o ciclo muda dentro da própria página
  // (ex.: orientação enviada na aba Avaliação) — nada aqui depende de recarregar.
  function renderStatusPill() {
    var st = Trackly.computeStatus(client);
    var pillClass = (st.code === "ok" || st.code === "waiting") ? "pill-ok" : st.code === "late" ? "pill-late" : "pill-warn";
    var el = document.getElementById("p-status");
    el.className = "pill " + pillClass;
    el.innerHTML = "<span class=\"dot\"></span>" + st.label;
  }
  renderStatusPill();

  // religada depois de salvar as métricas (ver btn-save-tracking em renderResumo), pra refletir
  // sem precisar recarregar a página.
  function renderHeroStats() {
    var heroItems = [];
    if (Trackly.isTracked(client, "weight")) {
      heroItems.push('<div class="hero-stat"><div class="value">' + kpi.weightNow + '<span class="unit">kg</span></div>' + deltaHtml(kpi.weightDelta, "kg") + '<div class="label">peso</div></div>');
    }
    if (Trackly.isTracked(client, "adherence")) {
      heroItems.push('<div class="hero-stat"><div class="value">' + kpi.adherenceAvg + '<span class="unit">%</span></div><div class="label">aderência</div></div>');
    }
    document.getElementById("p-hero-stats").innerHTML = heroItems.join("");
  }
  renderHeroStats();

  function deltaHtml(delta, unit, goodIfDown) {
    if (delta == null) return "";
    var good = goodIfDown ? delta <= 0 : Trackly.isGoodWeightDelta(client, delta);
    var arrow = delta === 0 ? "" : (delta < 0 ? "&darr; " : "&uarr; ");
    return '<div class="delta ' + (delta === 0 ? "delta-flat" : (good ? "delta-down" : "delta-up-bad")) + '">' + arrow + Math.abs(delta) + unit + "</div>";
  }

  // ---------------- VISÃO GERAL — foco atual + evolução essencial, nada além disso ----------------
  function renderResumo() {
    var cur = Trackly.currentWeek(client);
    var previewWeeks = client.weeks.slice(-8).map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.weight }; });

    var chips = [];
    if (Trackly.isTracked(client, "workouts")) chips.push('<div class="hero-stat sm"><div class="value">' + cur.metrics.workouts + '<span class="unit">/' + cur.metrics.workoutsGoal + '</span></div><div class="label">treinos</div></div>');
    if (Trackly.isTracked(client, "cardio")) chips.push('<div class="hero-stat sm"><div class="value">' + cur.metrics.cardio + '<span class="unit">/' + cur.metrics.cardioGoal + '</span></div><div class="label">cardio</div></div>');

    document.getElementById("tab-resumo").innerHTML =
      '<div class="section-label">Foco atual</div>' +
      '<p style="font-size:15px;line-height:1.5;margin:0 0 18px;">' + Trackly.focusLabelFromOrientation(client, refWeek0) + '.</p>' +
      (cur.orientation ? '<p style="font-size:13.5px;color:var(--ink-muted);line-height:1.6;margin:0 0 28px;font-style:italic;">"' + cur.orientation + '"</p>' : '') +
      '<div class="section-label">Evolução</div>' +
      (chips.length ? '<div style="display:flex;gap:36px;flex-wrap:wrap;margin-bottom:20px;">' + chips.join("") + '</div>' : '') +
      (Trackly.isTracked(client, "weight") ? (
        '<div class="chart-head"><h3 style="font-size:12.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;">Peso · 8 semanas</h3><a href="#" data-goto-evolucao style="font-size:12.5px;color:var(--brand);font-weight:600;">ver evolução</a></div>' +
        Charts.lineChart({ data: previewWeeks, height: 160, color: color, unit: "kg", maxXLabels: 4 })
      ) : "") +
      (function () {
        var mem = Trackly.buildCoachMemory(client);
        if (!mem) return "";
        var rows = [];
        if (mem.weightDelta != null) rows.push('<div class="hero-stat sm"><div class="value">' + (mem.weightDelta > 0 ? "+" : "") + mem.weightDelta + '<span class="unit">kg</span></div><div class="label">peso no período</div></div>');
        if (mem.adherenceAvg != null) rows.push('<div class="hero-stat sm"><div class="value">' + mem.adherenceAvg + '<span class="unit">%</span></div><div class="label">aderência média</div></div>');
        if (mem.totalScoredWeeks > 0) rows.push('<div class="hero-stat sm"><div class="value">' + mem.weeksWithinGoal + '<span class="unit">/' + mem.totalScoredWeeks + '</span></div><div class="label">semanas na meta</div></div>');

        var obs = "";
        if (mem.strengths.length || mem.attentionPoints.length) {
          obs = '<div style="margin-top:24px;">' +
            (mem.strengths.length ? '<div class="section-label" style="color:var(--brand);">O que está funcionando</div><div class="insight-list" style="margin-bottom:16px;">' + mem.strengths.map(function (s) { return '<div class="row"><span class="dot" style="background:var(--brand);"></span>' + s + '</div>'; }).join("") + '</div>' : "") +
            (mem.attentionPoints.length ? '<div class="section-label" style="color:var(--gold);">Merece atenção</div><div class="insight-list">' + mem.attentionPoints.map(function (s) { return '<div class="row"><span class="dot" style="background:var(--gold);"></span>' + s + '</div>'; }).join("") + '</div>' : "") +
          '</div>';
        }
        var milestone = mem.milestoneNote ? '<p style="font-size:12.5px;color:var(--ink-faint);margin:14px 0 0;">' + mem.milestoneNote + '</p>' : "";

        return (
          '<div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--line);">' +
            '<div class="section-label">' + mem.weeksTracked + ' semanas de acompanhamento</div>' +
            '<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:4px;">' + rows.join("") + '</div>' +
            milestone + obs +
          '</div>'
        );
      })();

    document.getElementById("tab-resumo").innerHTML += renderTrackingSettingsCard();

    var link = document.querySelector('[data-goto-evolucao]');
    if (link) link.addEventListener("click", function (e) { e.preventDefault(); document.querySelector('[data-tab="evolucao"]').click(); });
    wireTrackingSettingsCard();
  }

  // ---------------- MÉTRICAS ACOMPANHADAS (item 8 do TODO) ----------------
  // Cada aluno liga/desliga o que faz sentido pra ele em client.tracking — os pontos que leem
  // essas flags (isTracked, espalhado pelo check-in, evolução, histórico etc.) já fazem a métrica
  // desligada sumir por completo; isto aqui é só o formulário que grava a escolha do coach.
  function renderTrackingSettingsCard() {
    var checks = TRACKING_KEYS.map(function (key) {
      var checked = Trackly.isTracked(client, key) ? " checked" : "";
      return (
        '<div class="metrics-check">' +
          '<input type="checkbox" id="trk-' + key + '" data-key="' + key + '"' + checked + '>' +
          '<label for="trk-' + key + '">' + (TRACKING_LABELS[key] || key) + '</label>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="card card-pad" style="margin-top:32px;">' +
        '<div class="panel-head"><p class="card-title">Métricas acompanhadas</p></div>' +
        '<p class="card-sub">Escolha o que faz sentido acompanhar para ' + client.name + '. Métricas desligadas somem do check-in, da evolução e do resto do app — em vez de aparecerem vazias.</p>' +
        '<div class="metrics-grid">' + checks + '</div>' +
        '<div style="display:flex;gap:10px;align-items:center;margin-top:6px;">' +

        '<div class="cs-before" id="cs-before-clip" style="width:50%;"><div style="background:' + photoBg(0, photoAngleState.angle) + ';"><span class="cs-tag before">Antes · S' + compareState.a + '</span></div></div>' +
        '<div class="cs-handle" id="cs-handle" tabindex="0" role="slider" aria-label="Comparar antes e depois" aria-valuemin="4" aria-valuemax="96" aria-valuenow="50" style="left:50%;"></div>' +

  // ids são parametrizáveis porque a aba Fotos e a aba Avaliação montam,
  // cada uma, o seu próprio comparador antes/depois na mesma página.
  function wireCompareInteraction(wrapId, handleId, clipId) {
    var wrap = document.getElementById(wrapId || "cs-photo");
    var handle = document.getElementById(handleId || "cs-handle");
    var clip = document.getElementById(clipId || "cs-before-clip");
    var fullWidth = wrap.getBoundingClientRect().width;
    clip.firstElementChild.style.width = fullWidth + "px";
    var dragging = false;
    function setPct(pct) {
      pct = Math.max(4, Math.min(96, pct));
      clip.style.width = pct + "%";
      handle.style.left = pct + "%";
      handle.setAttribute("aria-valuenow", Math.round(pct));
    }
    function setPctFromX(clientX) {
      var rect = wrap.getBoundingClientRect();
      setPct(((clientX - rect.left) / rect.width) * 100);
    }
    handle.addEventListener("pointerdown", function (e) { dragging = true; handle.setPointerCapture(e.pointerId); });
    handle.addEventListener("pointermove", function (e) { if (dragging) setPctFromX(e.clientX); });
    handle.addEventListener("pointerup", function () { dragging = false; });
    handle.addEventListener("keydown", function (e) {
      var cur = parseFloat(handle.style.left) || 50;
      if (e.key === "ArrowLeft") { e.preventDefault(); setPct(cur - 5); }
      else if (e.key === "ArrowRight") { e.preventDefault(); setPct(cur + 5); }
    });
    wrap.addEventListener("click", function (e) { if (e.target === wrap || e.target.classList.contains("cs-after")) setPctFromX(e.clientX); });
  }

  // ---------------- HISTÓRICO — cada semana é o ciclo completo: ----------------
  // check-in recebido -> orientação do coach -> metas -> resultado.
  function historicoDrawerBody(w) {
    var submitted = w.checkin.status === "submitted";
    if (!submitted) {
      return '<div class="drawer-title">Semana ' + w.weekNumber + '</div><div class="drawer-sub">' + Trackly.fmtShort(w.end) + '</div>' +
        '<p style="font-size:13.5px;color:var(--ink-faint);margin:0;">Check-in ainda não enviado — previsto para ' + Trackly.fmtShort(w.end) + '.</p>';
    }
    var checklist = [
      { done: true, label: "Check-in enviado" },
      { done: !!w.orientation, label: "Coach revisou" },
      { done: !!w.orientation, label: "Orientação e metas definidas" }
    ];
    var body = '<div class="drawer-title">Semana ' + w.weekNumber + '</div><div class="drawer-sub">' + Trackly.fmtShort(w.end) + '</div>';
    body += '<div class="status-list compact" style="margin-bottom:18px;">' + checklist.map(function (s) {
      return '<div class="row' + (s.done ? "" : " pending-row") + '"><span class="mark ' + (s.done ? "done" : "pending") + '">' + (s.done ? ICONS.check : "") + '</span><span>' + s.label + '</span></div>';
    }).join("") + '</div>';

    var stripItems = [
      Trackly.isTracked(client, "weight") ? '<div class="item"><div class="label">Peso</div><div class="value">' + w.metrics.weight + '<span class="unit">kg</span></div></div>' : "",
      Trackly.isTracked(client, "adherence") ? '<div class="item"><div class="label">Dieta</div><div class="value">' + Math.round(w.metrics.adherence / 10) + '<span class="unit">/10</span></div></div>' : "",
      Trackly.isTracked(client, "workouts") ? '<div class="item"><div class="label">Treinos</div><div class="value">' + w.metrics.workouts + '<span class="unit">/' + w.metrics.workoutsGoal + '</span></div></div>' : "",
      Trackly.isTracked(client, "water") ? '<div class="item"><div class="label">Água</div><div class="value">' + w.metrics.water + '<span class="unit">L</span></div></div>' : "",
      Trackly.isTracked(client, "sleep") ? '<div class="item"><div class="label">Sono</div><div class="value">' + w.metrics.sleep + '<span class="unit">h</span></div></div>' : ""
    ].join("");
    body += '<div class="wc-block"><div class="wc-label">Check-in recebido</div><div class="resumo-strip">' + stripItems +
      '</div>' + (w.note ? '<p style="font-size:13px;color:var(--ink-faint);margin:10px 0 0;">"' + w.note + '"</p>' : "") + '</div>';

    body += '<div class="wc-block"><div class="wc-label">Orientação do coach</div>' +
      (w.orientation ? '<div class="wc-orientation">' + w.orientation + '</div>' : '<div class="wc-orientation" style="color:var(--ink-faint);">Aguardando revisão do coach.</div>') +
      '</div>';

    var goalsRow = Trackly.trackedGoals(w, client).filter(function (g) { return g.key !== "adherence"; }).map(function (g) {
      var color2 = g.status === "success" ? "var(--brand)" : g.status === "partial" ? "var(--gold)" : "var(--coral)";
      var ic = g.status === "success" ? ICONS.check : g.status === "partial" ? ICONS.warn : ICONS.dash;
      return '<span class="wc-goal"><span style="color:' + color2 + ';">' + ic + '</span>' + g.label + ': ' + g.actual + (g.unit === "%" ? "%" : "") + ' / ' + g.target + '</span>';
    }).join("");
    body += '<div class="wc-block"><div class="wc-label">Metas &amp; resultado</div><div class="wc-goals">' + goalsRow + '</div></div>';
    if (w.coachReview && w.coachReview.note) {
      body += '<div class="wc-block"><div class="wc-label">Nota do coach</div><div class="wc-orientation" style="font-style:italic;">' + w.coachReview.note + '</div></div>';
    }
    return body;

        ) : "");

    function wire() {
      panel.querySelector("#pg-plan-name").oninput = function (e) { planState.name = e.target.value; schedulePlanSave(); };
      panel.querySelector("#pg-plan-price").oninput = function (e) {
        var v = parseFloat(e.target.value);
        planState.priceCents = isNaN(v) ? 0 : Math.round(v * 100);
        schedulePlanSave();
      };
      panel.querySelector("#pg-plan-period").onchange = function (e) { planState.period = e.target.value; schedulePlanSave(); };
      panel.querySelector("#pg-sub-status").onchange = function (e) {
        Trackly.setSubscriptionStatus(client.id, e.target.value);
        flashSaved();
      };

      // TODO §21 — "Cobrar no WhatsApp" continua abrindo o link normalmente; só soma o registro in-app.
      var payBtn = panel.querySelector('[data-notify-payment="' + client.id + '"]');
      if (payBtn) payBtn.addEventListener("click", function () { Trackly.notify("payment_overdue", client.id); });

      panel.querySelectorAll("[data-refund]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          Trackly.refundPayment(client.id, btn.getAttribute("data-refund"));
          render();
        });
      });
    }

    render();
  }

  // ---------------- TREINO — o protocolo é montado aqui dentro, sem sair do perfil ----------------
  function renderTreino() {
    var panel = document.getElementById("tab-treino");
    var workout = client.workout ? JSON.parse(JSON.stringify(client.workout)) : { protocolName: "", days: [] };

    var CATEGORIES = [];
    Trackly.EXERCISE_LIBRARY.forEach(function (e) { if (CATEGORIES.indexOf(e.category) === -1) CATEGORIES.push(e.category); });
    function exerciseOptions(selectedId) {
      return CATEGORIES.map(function (cat) {
        var opts = Trackly.EXERCISE_LIBRARY.filter(function (e) { return e.category === cat; }).map(function (e) {
          return '<option value="' + e.id + '"' + (e.id === selectedId ? " selected" : "") + '>' + e.name + '</option>';
        }).join("");
        return '<optgroup label="' + cat + '">' + opts + '</optgroup>';
      }).join("");
    }

    var saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        Trackly.saveWorkoutProtocol(client.id, workout);
        var ind = document.getElementById("tr-save-indicator");
        ind.classList.add("show");
        setTimeout(function () { ind.classList.remove("show"); }, 1400);
      }, 350);
    }

    function newExercise() { return { exerciseId: Trackly.EXERCISE_LIBRARY[0].id, sets: 3, reps: 12, restSec: 60, rir: null, notes: "" }; }
    function newDay() { return { id: "d" + Date.now() + Math.floor(Math.random() * 1000), name: "Novo treino", durationMin: 45, exercises: [newExercise()] }; }

    panel.innerHTML =
      '<div class="panel-head">' +
        '<div class="section-label">Protocolo de treino</div>' +
        '<span class="save-indicator" id="tr-save-indicator">✓ Salvo</span>' +
      '</div>' +
      '<div class="field protocol-name-field">' +
        '<label>Nome do protocolo</label>' +
        '<input type="text" id="tr-protocol-name" placeholder="Ex: Hipertrofia — push/pull/legs">' +
      '</div>' +
      '<div id="tr-days"></div>' +
      '<button class="btn btn-secondary" id="tr-add-day">+ Adicionar dia de treino</button>';

    function render() {
      panel.querySelector("#tr-protocol-name").value = workout.protocolName || "";
      panel.querySelector("#tr-days").innerHTML = workout.days.map(function (day, di) {
        var exHead = '<div class="ex-head-row">' +
          '<div class="ex-col-label">Exercício</div><div class="ex-col-label">Séries</div><div class="ex-col-label">Reps</div>' +
          '<div class="ex-col-label">Descanso</div><div class="ex-col-label">RIR</div><div class="ex-col-label">Observações</div><div></div></div>';
        var exRows = day.exercises.map(function (ex, ei) {
          return '<div class="ex-row" data-day="' + di + '" data-ex="' + ei + '">' +
            '<div><span class="ex-mobile-label">Exercício</span><select data-field="exerciseId">' + exerciseOptions(ex.exerciseId) + '</select></div>' +
            '<div><span class="ex-mobile-label">Séries</span><input type="number" min="1" data-field="sets" value="' + ex.sets + '"></div>' +
            '<div><span class="ex-mobile-label">Reps</span><input type="text" data-field="reps" value="' + ex.reps + '" placeholder="12"></div>' +
            '<div><span class="ex-mobile-label">Descanso (s)</span><input type="number" min="0" step="15" data-field="restSec" value="' + ex.restSec + '"></div>' +
            '<div><span class="ex-mobile-label">RIR</span><input type="number" min="0" max="5" data-field="rir" value="' + (ex.rir == null ? "" : ex.rir) + '" placeholder="—"></div>' +
            '<div><span class="ex-mobile-label">Observações</span><input type="text" data-field="notes" value="' + (ex.notes || "").replace(/"/g, "&quot;") + '" placeholder="opcional"></div>' +
            '<div class="ex-mini-actions">' +
              '<button class="icon-btn" data-dup-ex title="Duplicar exercício">' + ICONS.plate + '</button>' +
              '<button class="icon-btn danger" data-del-ex title="Remover exercício">' + ICONS.close + '</button>' +
            '</div>' +
          '</div>';
        }).join("");
        return (
          '<div class="card card-pad day-card" data-day-card="' + di + '">' +
            '<div class="day-head">' +
              '<input type="text" data-field="name" data-day="' + di + '" value="' + day.name.replace(/"/g, "&quot;") + '">' +
              '<div class="dur"><input type="number" min="10" step="5" data-field="durationMin" data-day="' + di + '" value="' + day.durationMin + '"> min</div>' +
              '<div class="day-actions">' +
                '<button class="icon-btn" data-move-day-up="' + di + '" title="Mover pra cima"' + (di === 0 ? " disabled" : "") + '>&uarr;</button>' +
                '<button class="icon-btn" data-move-day-down="' + di + '" title="Mover pra baixo"' + (di === workout.days.length - 1 ? " disabled" : "") + '>&darr;</button>' +
                '<button class="icon-btn" data-dup-day="' + di + '" title="Duplicar dia">' + ICONS.plate + '</button>' +
                '<button class="icon-btn danger" data-del-day="' + di + '" title="Remover dia">' + ICONS.close + '</button>' +
              '</div>' +
            '</div>' +
            exHead + exRows +
            '<button class="btn btn-ghost" style="margin-top:10px;padding-left:0;" data-add-ex="' + di + '">+ Adicionar exercício</button>' +
          '</div>'
        );
      }).join("") || '<div class="empty-state"><h3>Nenhum dia de treino ainda</h3><p>Adicione o primeiro dia pra começar a montar o protocolo.</p></div>';
      wire();
    }

    function wire() {
      panel.querySelector("#tr-protocol-name").oninput = function (e) { workout.protocolName = e.target.value; scheduleSave(); };

      panel.querySelectorAll('[data-field="name"], [data-field="durationMin"]').forEach(function (el) {
        el.addEventListener("input", function () {
          var di = parseInt(el.getAttribute("data-day"), 10);
          var field = el.getAttribute("data-field");
          workout.days[di][field] = field === "durationMin" ? (parseInt(el.value, 10) || 0) : el.value;
          scheduleSave();
        });
      });

      panel.querySelectorAll(".ex-row").forEach(function (row) {
        var di = parseInt(row.getAttribute("data-day"), 10), ei = parseInt(row.getAttribute("data-ex"), 10);
        row.querySelectorAll("[data-field]").forEach(function (el) {
          el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function () {
            var field = el.getAttribute("data-field");
            var ex = workout.days[di].exercises[ei];
            if (field === "sets" || field === "restSec") ex[field] = parseInt(el.value, 10) || 0;
            else if (field === "rir") ex[field] = el.value === "" ? null : parseInt(el.value, 10);
            else ex[field] = el.value;
            scheduleSave();
          });
        });
        row.querySelector("[data-dup-ex]").addEventListener("click", function () {
          workout.days[di].exercises.splice(ei + 1, 0, JSON.parse(JSON.stringify(workout.days[di].exercises[ei])));
          scheduleSave(); render();
        });
        row.querySelector("[data-del-ex]").addEventListener("click", function () {
          workout.days[di].exercises.splice(ei, 1);
          scheduleSave(); render();
        });
      });

      panel.querySelectorAll("[data-add-ex]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var di = parseInt(btn.getAttribute("data-add-ex"), 10);
          workout.days[di].exercises.push(newExercise());
          scheduleSave(); render();
        });
      });

      panel.querySelectorAll("[data-move-day-up]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var di = parseInt(btn.getAttribute("data-move-day-up"), 10);
          if (di === 0) return;
          var tmp = workout.days[di - 1]; workout.days[di - 1] = workout.days[di]; workout.days[di] = tmp;
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-move-day-down]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var di = parseInt(btn.getAttribute("data-move-day-down"), 10);
          if (di === workout.days.length - 1) return;
          var tmp = workout.days[di + 1]; workout.days[di + 1] = workout.days[di]; workout.days[di] = tmp;
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-dup-day]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var di = parseInt(btn.getAttribute("data-dup-day"), 10);
          var copy = JSON.parse(JSON.stringify(workout.days[di]));
          copy.id = "d" + Date.now() + Math.floor(Math.random() * 1000);
          copy.name = copy.name + " (cópia)";
          workout.days.splice(di + 1, 0, copy);
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-del-day]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var di = parseInt(btn.getAttribute("data-del-day"), 10);
          workout.days.splice(di, 1);
          scheduleSave(); render();
        });
      });
    }

    panel.querySelector("#tr-add-day").addEventListener("click", function () {
      workout.days.push(newDay());
      scheduleSave(); render();
    });

    render();
  }

  // ---------------- NUTRIÇÃO — plano alimentar montado dentro do contexto do aluno ----------------

              '<div class="m-field"><label>Carbo (g)</label><input type="number" min="0" data-macro="carbs" data-meal="' + mi + '" value="' + meal.macros.carbs + '"></div>' +
              '<div class="m-field"><label>Gordura (g)</label><input type="number" min="0" data-macro="fat" data-meal="' + mi + '" value="' + meal.macros.fat + '"></div>' +
              '<div class="m-field"><label>Kcal</label><input type="number" min="0" data-macro="kcal" data-meal="' + mi + '" value="' + meal.macros.kcal + '"></div>' +

        });

        row.querySelectorAll("[data-field]").forEach(function (el) {
          el.addEventListener("input", function () { plan.meals[mi].items[ii][el.getAttribute("data-field")] = el.value; scheduleSave(); });

        btn.addEventListener("click", function () {
          plan.meals[parseInt(btn.getAttribute("data-add-item"), 10)].items.push({ food: "", qty: "" });
          scheduleSave(); render();
        });
      });

      panel.querySelectorAll(".sub-row").forEach(function (row) {
        var mi = parseInt(row.getAttribute("data-meal"), 10), si = parseInt(row.getAttribute("data-sub"), 10);
        row.querySelectorAll("[data-field]").forEach(function (el) {
          el.addEventListener("input", function () { plan.meals[mi].substitutes[si][parseInt(el.getAttribute("data-field"), 10)] = el.value; scheduleSave(); });
        });
        row.querySelector("[data-del-sub]").addEventListener("click", function () { plan.meals[mi].substitutes.splice(si, 1); scheduleSave(); render(); });
      });
      panel.querySelectorAll("[data-add-sub]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          plan.meals[parseInt(btn.getAttribute("data-add-sub"), 10)].substitutes.push(["", ""]);
          scheduleSave(); render();
        });
      });

      panel.querySelectorAll("[data-move-up]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var mi = parseInt(btn.getAttribute("data-move-up"), 10);
          if (mi === 0) return;
          var tmp = plan.meals[mi - 1]; plan.meals[mi - 1] = plan.meals[mi]; plan.meals[mi] = tmp;
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-move-down]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var mi = parseInt(btn.getAttribute("data-move-down"), 10);
          if (mi === plan.meals.length - 1) return;
          var tmp = plan.meals[mi + 1]; plan.meals[mi + 1] = plan.meals[mi]; plan.meals[mi] = tmp;
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-dup-meal]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var mi = parseInt(btn.getAttribute("data-dup-meal"), 10);
          var copy = JSON.parse(JSON.stringify(plan.meals[mi]));
          copy.id = "m" + Date.now() + Math.floor(Math.random() * 1000);
          copy.name = copy.name + " (cópia)";
          plan.meals.splice(mi + 1, 0, copy);
          scheduleSave(); render();
        });
      });
      panel.querySelectorAll("[data-del-meal]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          plan.meals.splice(parseInt(btn.getAttribute("data-del-meal"), 10), 1);
          scheduleSave(); render();
        });
      });
    }

    panel.querySelector("#nu-add-meal").addEventListener("click", function () {
      plan.meals.push(newMeal());
      scheduleSave(); render();
    });

    render();
  }

  // ---------------- AVALIAÇÃO — o ciclo da semana se fecha aqui, sem sair do perfil ----------------
  function renderAvaliacao() {
    var panel = document.getElementById("tab-avaliacao");
    var cur = Trackly.currentWeek(client);

    if (!cur || cur.checkin.status !== "submitted") {
      panel.innerHTML =
        '<div class="card card-pad" style="text-align:center;padding:48px 24px;">' +
        '<p class="card-title" style="margin-bottom:6px;">Ainda não há check-in pra revisar</p>' +
        '<p class="card-sub" style="margin-bottom:0;">' + client.name + ' ainda não enviou o check-in da semana ' + (cur ? cur.weekNumber : "") + '.</p>' +
        '</div>';
      return;
    }
    // abrir esta aba é a transição checkin_received -> under_review do ciclo (idempotente:
    // uma semana que já tem rascunho ou orientação enviada nunca volta pra "em avaliação")
    Trackly.markUnderReview(client.id, cur.weekNumber);
    renderStatusPill();
    var evalStatus = Trackly.computeStatus(client);
    var qa = cur.qa || {};
    var draft = cur.orientationDraft || null; // rascunho salvo antes (mesma semana), se houver
    var suggestedFocus = draft && draft.focusOverride ? draft.focusOverride : Trackly.focusLabel(client);

    var qaKeyTracks = { cardioDetalhe: "cardio", performanceTreino: "workouts", digestao: "digestion", emocional: "emotional" };
    var qaLabels = [
      ["dieta", "Como foi a dieta?"],
      ["refeicaoLivre", "Fez a refeição livre? Se sim, qual dia e o que comeu?"],
      ["beliscos", "Houve beliscos de comida fora do plano?"],
      ["cardioDetalhe", "Como foi o cardio? Tempo, dias e tipo."],
      ["performanceTreino", "Como foi sua performance nos treinos?"],
      ["periodoMenstrual", "Está no período menstrual?"],
      ["digestao", "Como foi sua digestão? Idas ao banheiro e estufamento."],
      ["emocional", "Como está seu emocional?"],
      ["substancias", "Uso de substâncias/medicamentos, quando aplicável."],
      ["exame", "Último exame enviado, quando aplicável."]
    ].filter(function (row) { return qa[row[0]] != null && (!qaKeyTracks[row[0]] || Trackly.isTracked(client, qaKeyTracks[row[0]])); });

    var goalIcons = { water: ICONS.drop, sleep: ICONS.moon, workouts: ICONS.dumbbell, cardio: ICONS.run };
    var goalFieldsHtml = Trackly.trackedGoals(cur, client).filter(function (g) { return g.key !== "adherence"; }).map(function (g) {
      var draftTarget = draft && draft.nextGoals && draft.nextGoals[g.key] != null ? draft.nextGoals[g.key] : g.target;
      return '<div class="m-field"><label>' + goalIcons[g.key] + g.label + (g.unit && g.unit !== "sessões" ? " (" + g.unit + ")" : "") + '</label><input type="number" step="' + (g.key === "workouts" || g.key === "cardio" ? "1" : "0.1") + '" value="' + draftTarget + '" data-key="' + g.key + '"></div>';
    }).join("");

    var photoAngles = [["front", "FRENTE"], ["back", "COSTAS"], ["side_l", "LAT."]];
    var photosHtml = photoAngles.map(function (a, i) {
      return '<div class="mini-photo" style="background:hsl(' + hue + ',' + (26 + i * 4) + '%,' + (26 + i * 5) + '%);">' + a[1] + '</div>';
    }).join("");

    // peso desta semana vs. a submissão anterior — para o hero-stat
    var weeksSoFar = client.weeks.slice(0, client.weeks.indexOf(cur) + 1).filter(function (w) { return w.checkin.status === "submitted"; });
    var prevSubmitted = weeksSoFar.length > 1 ? weeksSoFar[weeksSoFar.length - 2] : null;
    var weightDeltaForHero = "";
    if (prevSubmitted && Trackly.isTracked(client, "weight")) {
      var wd = Trackly.round1(cur.metrics.weight - prevSubmitted.metrics.weight);
      var wdGood = Trackly.isGoodWeightDelta(client, wd);
      weightDeltaForHero = '<div class="delta" style="color:' + (wd === 0 ? "var(--ink-faint)" : (wdGood ? "var(--brand)" : "var(--coral)")) + ';">' + (wd === 0 ? "" : (wd < 0 ? "↓ " : "↑ ")) + Math.abs(wd) + 'kg</div>';
    }

    // "O que mudou" — pares antes->depois compactos (brief V7 §14), não mais frases soltas
    var whatChangedRows = (function () {
      if (!prevSubmitted) return [];
      var rows = [];
      if (Trackly.isTracked(client, "weight")) {
        var wd2 = Trackly.round1(cur.metrics.weight - prevSubmitted.metrics.weight);
        if (Math.abs(wd2) >= 0.1) rows.push({ label: "Peso", from: prevSubmitted.metrics.weight + "kg", to: cur.metrics.weight + "kg", arrow: wd2 < 0 ? "↓" : "↑", good: Trackly.isGoodWeightDelta(client, wd2) });
      }
      if (Trackly.isTracked(client, "adherence")) {
        var adDelta = cur.metrics.adherence - prevSubmitted.metrics.adherence;
        if (Math.abs(adDelta) >= 2) rows.push({ label: "Aderência", from: prevSubmitted.metrics.adherence + "%", to: cur.metrics.adherence + "%", arrow: adDelta > 0 ? "↑" : "↓", good: adDelta > 0, extra: Math.abs(adDelta) + " pts" });
      }
      if (Trackly.isTracked(client, "sleep")) {
        var slDelta = Trackly.round1(cur.metrics.sleep - prevSubmitted.metrics.sleep);
        if (Math.abs(slDelta) >= 0.4) rows.push({ label: "Sono", from: prevSubmitted.metrics.sleep + "h", to: cur.metrics.sleep + "h", arrow: slDelta < 0 ? "↓" : "↑", good: slDelta >= 0 });
      }
      return rows;
    })();

    // Últimas semanas — contexto de tendência antes de decidir
    var recent = Trackly.recentWeeksTable(client, 3);
    var recentTableHtml = recent.weeks.length < 2 ? "" : (
      '<div style="margin-bottom:26px;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">' +
          '<p class="section-label" style="margin-bottom:0;">Últimas semanas</p>' +
          '<a href="#" id="av-goto-historico" style="font-size:12px;color:var(--brand);font-weight:600;">Ver histórico</a>' +
        '</div>' +
        '<div style="overflow-x:auto;"><table class="recent-table"><thead><tr><th></th>' +
          recent.weeks.map(function (w, i) { return '<th class="' + (i === recent.weeks.length - 1 ? "now" : "") + '">' + (i === recent.weeks.length - 1 ? "Atual" : "S-" + (recent.weeks.length - 1 - i)) + '</th>'; }).join("") +
        '</tr></thead><tbody>' +
        recent.cols.map(function (col) {
          return '<tr><td class="metric-label">' + col.label + '</td>' + recent.weeks.map(function (w, i) {
            return '<td class="' + (i === recent.weeks.length - 1 ? "now" : "") + '">' + col.fmt(w) + '</td>';
          }).join("") + '</tr>';
        }).join("") +
        '</tbody></table></div>' +
      '</div>'
    );

    // "Evolução desta semana" — peso + a mesma foto grande de comparação usada na aba Fotos.
    // O peso/aderência do topo (Resumo da Semana) sempre compara com a semana imediatamente
    // anterior; "Comparar com" é local a este módulo e nunca muda esse valor global (brief V9 §18).
    var angleState = { angle: "front" };
    var compareWeekState = { weekNumber: prevSubmitted ? prevSubmitted.weekNumber : null };
    function moduleDeltaHtml(compareWeek) {
      if (!compareWeek || !Trackly.isTracked(client, "weight")) return "";
      var d = Trackly.round1(cur.metrics.weight - compareWeek.metrics.weight);
      var good = Trackly.isGoodWeightDelta(client, d);
      return '<div class="delta" style="color:' + (d === 0 ? "var(--ink-faint)" : (good ? "var(--brand)" : "var(--coral)")) + ';">' + (d === 0 ? "" : (d < 0 ? "↓ " : "↑ ")) + Math.abs(d) + 'kg</div>';
    }
    var priorSubmittedWeeks = weeksSoFar.slice(0, -1); // todas as semanas enviadas antes da atual — opções do seletor
    function buildCompareMeta(compareWeek) {
      if (!compareWeek) return "";
      var items = [
        Trackly.isTracked(client, "weight") ? (function () { var d = Trackly.round1(cur.metrics.weight - compareWeek.metrics.weight); return { l: "Peso", from: compareWeek.metrics.weight + " kg", to: cur.metrics.weight + " kg", pct: Trackly.round1(100 * d / compareWeek.metrics.weight) }; })() : null,
        Trackly.isTracked(client, "measurements") && compareWeek.metrics.waist != null && cur.metrics.waist != null ? { l: "Cintura", from: compareWeek.metrics.waist + " cm", to: cur.metrics.waist + " cm", pct: Trackly.round1(100 * (cur.metrics.waist - compareWeek.metrics.waist) / compareWeek.metrics.waist) } : null,
        Trackly.isTracked(client, "adherence") ? { l: "Aderência", from: compareWeek.metrics.adherence + "%", to: cur.metrics.adherence + "%", pct: Trackly.round1(cur.metrics.adherence - compareWeek.metrics.adherence) } : null
      ].filter(Boolean);
      if (!items.length) return "";
      return '<div class="compare-meta" id="av-compare-meta">' + items.map(function (m) {
        // direção de "bom" varia por métrica — aderência sobe é bom (mesmo fix do portal/evolucao.html).
        var good = m.l === "Aderência" ? m.pct >= 0 : (m.l === "Peso" ? Trackly.isGoodWeightDelta(client, m.pct) : m.pct <= 0);
        return '<div class="cm-item"><div class="l">' + m.l + '</div><div class="v">' + m.from + ' → ' + m.to + '</div><div style="color:' + (good ? "var(--brand)" : "var(--coral)") + ';font-weight:600;">' + (m.pct > 0 ? "+" : "") + m.pct + '%</div></div>';
      }).join("") + '</div>';
    }
    var evoWeekModuleHtml = (function () {
      var compareWeek = compareWeekState.weekNumber ? client.weeks[compareWeekState.weekNumber - 1] : null;
      var hasPhotoPair = Trackly.isTracked(client, "photos") && compareWeek;
      var pickerHtml = priorSubmittedWeeks.length > 1 ? (
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12.5px;color:var(--ink-faint);">' +
          '<span>Comparar com</span>' +
          '<select id="av-compare-week-select" style="border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:6px 10px;background:var(--surface);color:var(--ink);font-size:12.5px;font-family:var(--font-body);">' +
            priorSubmittedWeeks.map(function (w) { return '<option value="' + w.weekNumber + '"' + (w.weekNumber === compareWeekState.weekNumber ? " selected" : "") + '>Semana ' + w.weekNumber + '</option>'; }).join("") +
          '</select>' +
        '</div>'
      ) : "";
      var sliderHtml = !hasPhotoPair ? "" : (
        '<div class="angle-tabs" id="av-angle-tabs" style="margin-bottom:14px;">' +
          ["front", "back", "side"].map(function (a) {
            var names = { front: "Frente", back: "Costas", side: "Lateral" };
            return '<button data-angle="' + a + '" class="' + (angleState.angle === a ? "active" : "") + '">' + names[a] + '</button>';
          }).join("") +
        '</div>' +
        '<div class="compare-slider" id="av-cs-photo">' +
          '<div class="cs-after" style="background:' + photoBg(1, angleState.angle) + ';"><span class="cs-tag after">Agora · S' + cur.weekNumber + '</span></div>' +
          '<div class="cs-before" id="av-cs-before-clip" style="width:50%;"><div style="background:' + photoBg(0, angleState.angle) + ';"><span class="cs-tag before" id="av-cs-before-tag">Antes · S' + compareWeek.weekNumber + '</span></div></div>' +
          '<div class="cs-handle" id="av-cs-handle" tabindex="0" role="slider" aria-label="Comparar antes e depois" aria-valuemin="4" aria-valuemax="96" aria-valuenow="50" style="left:50%;"></div>' +
        '</div>'
      );
      if (!pickerHtml && !sliderHtml && !Trackly.isTracked(client, "weight")) return "";
      return (
        '<div style="margin-bottom:28px;">' +
          '<p class="section-label">Evolução desta semana</p>' +
          (Trackly.isTracked(client, "weight") ? '<div class="hero-stat" style="margin-bottom:16px;" id="av-evo-week-hero"><div class="value">' + cur.metrics.weight + '<span class="unit">kg</span></div><div id="av-evo-week-delta">' + moduleDeltaHtml(compareWeek) + '</div><div class="label" id="av-evo-week-label">peso' + (compareWeek ? " · semana " + compareWeek.weekNumber + " → " + cur.weekNumber : "") + '</div></div>' : "") +
          pickerHtml + sliderHtml + buildCompareMeta(compareWeek) +
        '</div>'
      );
    })();

    panel.innerHTML =
      '<div id="av-body">' +
      '<div class="review-head">' +
        '<div class="wk">Semana ' + cur.weekNumber + ' &nbsp;·&nbsp; recebido ' + Trackly.relativeLabel(cur.checkin.submittedAt) + '</div>' +
        '<span class="pill ' + (evalStatus.code === "ok" ? "pill-ok" : "pill-warn") + '" style="margin-top:10px;"><span class="dot"></span>' + evalStatus.label.toUpperCase() + '</span>' +
      '</div>' +

      '<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:28px;">' +
        (Trackly.isTracked(client, "weight") ? '<div class="hero-stat"><div class="value">' + cur.metrics.weight + '<span class="unit">kg</span></div>' + weightDeltaForHero + '<div class="label">peso</div></div>' : "") +
        (Trackly.isTracked(client, "adherence") ? '<div class="hero-stat"><div class="value">' + cur.metrics.adherence + '<span class="unit">%</span></div><div class="label">aderência</div></div>' : "") +
        (Trackly.isTracked(client, "workouts") ? '<div class="hero-stat"><div class="value">' + cur.metrics.workouts + '<span class="unit">/' + cur.metrics.workoutsGoal + '</span></div><div class="label">treinos</div></div>' : "") +
      '</div>' +

      evoWeekModuleHtml +

      (whatChangedRows.length ? (
      '<div style="margin-bottom:26px;">' +
        '<p class="section-label">O que mudou</p>' +
        '<div class="stack" style="gap:10px;">' + whatChangedRows.map(function (r) {
          return '<div style="display:flex;align-items:baseline;justify-content:space-between;font-size:13.5px;"><span style="color:var(--ink-muted);">' + r.label + '</span><span>' + r.from + ' → ' + r.to + ' <strong style="color:' + (r.good ? "var(--brand)" : "var(--coral)") + ';">' + r.arrow + (r.extra ? " " + r.extra : "") + '</strong></span></div>';
        }).join("") + '</div>' +
      '</div>'
      ) : "") +

      recentTableHtml +

      '<div style="margin-bottom:26px;">' +
        '<button class="disclosure-btn" id="av-qa-toggle">' + ICONS.chevronR + '<span>Ver respostas completas</span></button>' +
        '<div class="disclosure-panel" id="av-qa-panel">' +
          '<div class="qa-list">' + qaLabels.map(function (row) {
            return '<div class="qa-item"><div class="q">' + row[1] + '</div><div class="a">' + qa[row[0]] + '</div></div>';
          }).join("") + '</div>' +
          (cur.note ? '<div class="qa-item" style="margin-top:16px;"><div class="q">Observação livre</div><div class="a">"' + cur.note + '"</div></div>' : "") +
          (Trackly.isTracked(client, "photos") ? '<div class="qa-item" style="margin-top:16px;"><div class="q">Fotos desta semana</div><div class="mini-photo-row">' + photosHtml + '</div></div>' : "") +
        '</div>' +
      '</div>' +

      '<div style="margin-bottom:26px;">' +
        '<p class="section-label">Notas do coach</p>' +
        '<textarea id="av-coach-note-input" rows="2" placeholder="Algo que não cabe nos números? (opcional, só você vê)" style="width:100%;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 13px;font-family:var(--font-body);font-size:13.5px;background:var(--surface);color:var(--ink);resize:vertical;">' + ((draft && draft.note) || (cur.coachReview && cur.coachReview.note) || "") + '</textarea>' +
      '</div>' +

      '<div class="card card-pad" style="margin-bottom:18px;">' +
        '<p class="card-title" style="margin-bottom:4px;">O que você quer orientar esta semana?</p>' +
        '<p class="card-sub" style="margin-bottom:16px;">Visível para ' + client.name.split(" ")[0] + ' assim que você enviar.</p>' +
        '<label style="font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px;">Foco da semana</label>' +
        '<input type="text" class="focus-input" id="av-focus-input" placeholder="Ex.: melhorar consistência do sono" value="' + suggestedFocus + '">' +
        '<label style="font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px;">Orientação</label>' +
        '<div class="field" style="margin-bottom:0;"><textarea id="av-orientation-input" rows="4" placeholder="Ex.: manter alimentação atual, aumentar água para 3L/dia, dormir pelo menos 7h30...">' + (draft && draft.orientation ? draft.orientation : Trackly.suggestOrientation(client)) + '</textarea></div>' +
        (draft ? '<p class="card-sub" id="av-draft-hint" style="margin:12px 0 0;">Rascunho salvo ' + Trackly.relativeLabel(draft.savedAt) + ' — ' + client.name.split(" ")[0] + ' ainda não recebeu nada.</p>' : '') +
      '</div>' +

      '<div class="card card-pad" style="margin-bottom:22px;">' +
        '<p class="card-title" style="margin-bottom:4px;">Metas da semana</p>' +
        '<p class="card-sub" style="margin-bottom:14px;">Metas de ' + client.name.split(" ")[0] + ' — específicas pra ele(a), não um padrão geral.</p>' +
        '<div class="metas-editor" id="av-metas-editor">' +
          goalFieldsHtml +
        '</div>' +
      '</div>' +

      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
        '<button class="btn btn-primary btn-lg" id="av-send-orientation">Enviar orientação</button>' +
        '<button class="btn btn-secondary" id="av-save-draft">Salvar rascunho</button>' +
      '</div>' +
      '</div>' +
      '<div id="av-confirm" style="display:none;"></div>';

    panel.querySelector("#av-qa-toggle").addEventListener("click", function () {
      this.classList.toggle("open");
      panel.querySelector("#av-qa-panel").classList.toggle("open");
      this.querySelector("span").textContent = this.classList.contains("open") ? "Ocultar respostas" : "Ver o que ele respondeu";
    });

    var gotoHist = panel.querySelector("#av-goto-historico");
    if (gotoHist) gotoHist.addEventListener("click", function (e) { e.preventDefault(); document.querySelector('[data-tab="historico"]').click(); });

    if (panel.querySelector("#av-cs-photo")) wireCompareInteraction("av-cs-photo", "av-cs-handle", "av-cs-before-clip");
    var angleTabsEl = panel.querySelector("#av-angle-tabs");
    if (angleTabsEl) angleTabsEl.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { angleState.angle = b.getAttribute("data-angle"); rerenderEvoModule(); });
    });
    var compareWeekSelectEl = panel.querySelector("#av-compare-week-select");
    if (compareWeekSelectEl) compareWeekSelectEl.addEventListener("change", function () {
      compareWeekState.weekNumber = parseInt(compareWeekSelectEl.value, 10);
      var compareWeek = client.weeks[compareWeekState.weekNumber - 1];
      var beforeTagEl = panel.querySelector("#av-cs-before-tag");
      if (beforeTagEl) beforeTagEl.textContent = "Antes · S" + compareWeek.weekNumber;
      panel.querySelector("#av-evo-week-delta").innerHTML = moduleDeltaHtml(compareWeek);
      panel.querySelector("#av-evo-week-label").textContent = "peso · semana " + compareWeek.weekNumber + " → " + cur.weekNumber;
      var metaEl = panel.querySelector("#av-compare-meta");
      if (metaEl) metaEl.outerHTML = buildCompareMeta(compareWeek);
    });

    function rerenderEvoModule() {
      var wrap = panel.querySelector("#av-cs-photo");
      if (!wrap) return;
      wrap.querySelector(".cs-after").style.background = photoBg(1, angleState.angle);
      wrap.querySelector(".cs-before > div").style.background = photoBg(0, angleState.angle);
      angleTabsEl.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-angle") === angleState.angle); });
    }

    function readGoalInputs() {
      var goals = {};
      panel.querySelectorAll("#av-metas-editor input[data-key]").forEach(function (input) {
        goals[input.getAttribute("data-key")] = parseFloat(input.value);
      });
      return goals;
    }

    // Salvar sem enviar: o ciclo vai pra orientation_draft e o aluno continua sem ver nada.
    panel.querySelector("#av-save-draft").addEventListener("click", function () {
      Trackly.saveOrientationDraft(client.id, cur.weekNumber, {
        orientation: panel.querySelector("#av-orientation-input").value.trim(),
        focusOverride: panel.querySelector("#av-focus-input").value.trim() || null,
        nextGoals: readGoalInputs(),
        note: panel.querySelector("#av-coach-note-input").value.trim() || null
      });
      var hint = panel.querySelector("#av-draft-hint");
      if (!hint) {
        hint = document.createElement("p");
        hint.className = "card-sub";
        hint.id = "av-draft-hint";
        hint.style.margin = "12px 0 0";
        panel.querySelector("#av-orientation-input").closest(".card").appendChild(hint);
      }
      hint.textContent = "Rascunho salvo agora — " + client.name.split(" ")[0] + " ainda não recebeu nada.";
      renderStatusPill();
      TracklyNav.toast("Rascunho salvo");
    });

    panel.querySelector("#av-send-orientation").addEventListener("click", function () {
      Trackly.completeOrientation(client.id, {
        focus: panel.querySelector("#av-focus-input").value.trim(),
        orientation: panel.querySelector("#av-orientation-input").value.trim(),
        note: panel.querySelector("#av-coach-note-input").value.trim(),
        goals: readGoalInputs()
      });

      // o ciclo mudou: o pill volta a refletir o estado real e as outras abas
      // (resumo, evolução, histórico) são remontadas na próxima vez que forem abertas.
      renderStatusPill();
      invalidateTabs(["avaliacao"]);

      panel.querySelector("#av-body").style.display = "none";
      var el = panel.querySelector("#av-confirm");
      el.style.display = "block";
      var firstName = client.name.split(" ")[0];
      el.innerHTML =
        '<div class="confirm-wrap"><div class="ring">' + ICONS.check + '</div>' +
        '<h2>Avaliação concluída</h2>' +
        '<div class="status-list" style="text-align:left;max-width:280px;margin:0 auto 20px;">' +
          '<div class="row"><span class="mark done">' + ICONS.check + '</span><span>Peso analisado</span></div>' +
          (Trackly.isTracked(client, "photos") ? '<div class="row"><span class="mark done">' + ICONS.check + '</span><span>Fotos comparadas</span></div>' : "") +
          '<div class="row"><span class="mark done">' + ICONS.check + '</span><span>Orientação enviada</span></div>' +
        '</div>' +
        '<p>' + firstName + ' está atualizado' + (client.gender === "f" ? "a" : "") + '.</p>' +
        (client.phone ? '<a href="' + Trackly.whatsappUrl(client.phone, Trackly.orientationReadyMessageForStudent(client)) + '" target="_blank" rel="noopener" class="btn btn-ghost" style="margin-bottom:16px;">Avisar ' + firstName + ' no WhatsApp</a><br>' : '') +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
          '<button class="btn btn-secondary" id="av-back-to-resumo">Ver visão geral</button>' +
          '<a href="dashboard.html" class="btn btn-primary">Voltar ao acompanhamento</a>' +
        '</div></div>';
      el.querySelector("#av-back-to-resumo").addEventListener("click", function () { document.querySelector('[data-tab="resumo"]').click(); });
    });
  }

  var renderers = { resumo: renderResumo, treino: renderTreino, nutricao: renderNutricao, avaliacao: renderAvaliacao, evolucao: renderEvolucao, fotos: renderFotos, historico: renderHistorico, pagamentos: renderPagamentos };
  var rendered = {};
  // quando o ciclo muda dentro de uma aba (orientação enviada), as demais precisam
  // ser remontadas na próxima abertura em vez de mostrar dados da semana anterior.
  function invalidateTabs(keep) {
    Object.keys(rendered).forEach(function (t) { if (keep.indexOf(t) === -1) delete rendered[t]; });
  }
  function activateTab(tab) {
    var btn = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
    if (!btn) return;
    document.querySelectorAll(".tab-btn[data-tab]").forEach(function (b) { b.classList.remove("active"); });
    document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("tab-" + tab).classList.add("active");
    if (!rendered[tab]) { renderers[tab](); rendered[tab] = true; }
  }
  document.querySelectorAll(".tab-btn[data-tab]").forEach(function (btn) {
    btn.addEventListener("click", function () { activateTab(btn.getAttribute("data-tab")); });
  });
  var deepLinkTab = location.hash.replace("#", "");
  if (deepLinkTab && renderers[deepLinkTab]) { activateTab(deepLinkTab); } else { renderResumo(); rendered.resumo = true; }
})();
</script>
</body>
</html>
