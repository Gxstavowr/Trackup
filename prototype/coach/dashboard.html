<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .greet { font-size: 14px; color: var(--ink-muted); margin-bottom: 2px; }
  .week-summary { margin: 22px 0 34px; }
  .week-summary .range { font-size: 13px; color: var(--ink-faint); text-align: center; margin-bottom: 4px; }
  .queue-section { margin-bottom: 30px; }
  .all-done { text-align: center; padding: 30px 20px; }
  .all-done svg { color: var(--brand); margin-bottom: 10px; }
  .all-done p { font-size: 14px; margin: 0; }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="shell">
  <div id="shell-sidebar"></div>
  <main class="main">
    <div class="main-inner">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <p class="greet" id="greet"></p>
      <div class="page-head" style="margin-bottom:0;">
        <div><h1>Acompanhamento da semana</h1></div>
      </div>

      <div class="week-summary">
        <p class="range" id="week-range"></p>
        <div class="big-counter" id="week-counter"></div>
        <div class="week-progress-bar" style="max-width:260px;margin:14px auto 0;"><div class="fill" id="week-fill"></div></div>
      </div>

      <div id="queue-received" class="queue-section"></div>
      <div id="queue-completed" class="queue-section"></div>
      <div id="queue-awaiting" class="queue-section"></div>
    </div>
  </main>
</div>

<script src="../assets/js/storage.js?v=8"></script>
<script src="../assets/js/data.js?v=8"></script>
<script src="../assets/js/icons.js?v=8"></script>
<script src="../assets/js/charts.js?v=8"></script>
<script src="../assets/js/nav.js?v=8"></script>
<script>
(function () {
  TracklyNav.mountCoachShell("dashboard");
  var active = Trackly.CLIENTS.filter(function (c) { return c.weeks.length > 0; });

  var hour = new Date().getHours();
  var greeting = hour < 12 ? "Bom dia" : hour < 18 ? "Boa tarde" : "Boa noite";
  document.getElementById("greet").textContent = greeting + ", " + Trackly.COACH.name.split(" ")[0] + ".";

  function render() {
    var snap = Trackly.buildWeeklySnapshot();
    var anchorEnd = Trackly.ANCHOR; var anchorStart = new Date(anchorEnd); anchorStart.setDate(anchorStart.getDate() - anchorStart.getDay() + 1);
    var weekEnd = new Date(anchorStart); weekEnd.setDate(weekEnd.getDate() + 6);
    document.getElementById("week-range").textContent = "Semana de " + Trackly.fmtShort(anchorStart) + " a " + Trackly.fmtDate(weekEnd).slice(0, 5);

    var received = active.filter(function (c) { return Trackly.clientStage(c) === "checkin_received"; });
    var completed = active.filter(function (c) { return Trackly.clientStage(c) === "completed"; });
    var awaiting = active.filter(function (c) { return Trackly.clientStage(c) === "awaiting_checkin"; });
    var allDone = active.length > 0 && !received.length && !awaiting.length;

    document.getElementById("week-counter").innerHTML =
      '<div class="num">' + completed.length + '<span class="of">/' + snap.total + '</span></div>' +
      '<div class="cap">acompanhados</div>' +
      '<div class="sub">' +
        (received.length ? '<span><b>' + received.length + '</b> para revisar</span>' : '') +
        (awaiting.length ? '<span><b>' + awaiting.length + '</b> aguardando resposta</span>' : '') +
      '</div>';
    document.getElementById("week-fill").style.width = (snap.total ? Math.round(100 * completed.length / snap.total) : 0) + "%";

    if (allDone) {
      document.getElementById("queue-received").innerHTML = '<div class="all-done">' + ICONS.check + '<h3 style="font-family:var(--font-display);font-size:17px;margin:0 0 4px;">Acompanhamento da semana concluído</h3><p>Todos os ' + active.length + ' alunos foram revisados.</p></div>';
      document.getElementById("queue-awaiting").innerHTML = "";
      document.getElementById("queue-completed").innerHTML = renderCompletedSection(completed);
      wireCompletedToggle();
      document.querySelectorAll("[data-remind]").forEach(function (btn) { btn.addEventListener("click", function () { Trackly.sendReminder(btn.getAttribute("data-remind")); render(); }); });
      return;
    }

    document.getElementById("queue-received").innerHTML = !received.length ? "" : (
      '<p class="section-label">Para revisar</p>' + received.map(function (c) {
        var u = Trackly.studentUpdate(c), color = TracklyNav.colorFor(c);
        var stats = [];
        if (u.weightDelta != null && Math.abs(u.weightDelta) >= 0.1) stats.push('<span style="color:' + (u.weightGood ? "var(--brand)" : "var(--coral)") + ';">Peso ' + (u.weightDelta < 0 ? "↓" : "↑") + ' ' + Math.abs(u.weightDelta) + 'kg</span>');
        else if (u.weightDelta != null) stats.push('<span>Peso estável</span>');
        stats.push('<span>Aderência ' + u.adherenceNow + '%' + (u.adherenceTrend === "up" ? " ↑" : u.adherenceTrend === "down" ? " ↓" : "") + '</span>');
        if (u.sleepTrend === "down") stats.push('<span style="color:var(--coral);">Sono ↓</span>');
        return '<div class="list-row"><span class="avatar lr-lead" style="background:' + color + '">' + c.initials + '</span>' +
          '<div class="lr-body"><strong>' + c.name + '</strong><span class="lr-meta">' + u.label + '</span><div class="lr-stats">' + stats.join("") + '</div></div>' +
          '<div class="lr-actions"><a href="revisar.html?id=' + c.id + '" class="btn btn-primary">Revisar</a></div></div>';
      }).join("")
    );

    document.getElementById("queue-completed").innerHTML = renderCompletedSection(completed);

    document.getElementById("queue-awaiting").innerHTML = !awaiting.length ? "" : (
      '<p class="section-label">Aguardando resposta</p>' + awaiting.map(function (c) {
        var color = TracklyNav.colorFor(c), u = Trackly.studentUpdate(c);
        var reminded = c.remindedAt;
        return '<div class="list-row"><span class="avatar lr-lead" style="background:' + color + '">' + c.initials + '</span>' +
          '<div class="lr-body"><strong>' + c.name + '</strong><span class="lr-meta">' + u.label + '</span></div>' +
          '<div class="lr-actions">' +
            '<a href="cliente.html?id=' + c.id + '" class="btn btn-secondary">Ver aluno</a>' +
            (reminded ? '<span style="font-size:12px;color:var(--ink-faint);">Lembrete ' + Trackly.relativeLabel(reminded) + '</span>' : '<button class="btn btn-ghost" data-remind="' + c.id + '">Enviar lembrete</button>') +
          '</div></div>';
      }).join("")
    );

    document.querySelectorAll("[data-remind]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        Trackly.sendReminder(btn.getAttribute("data-remind"));
        render();
      });
    });
    wireCompletedToggle();
  }

  function renderCompletedSection(completed) {
    if (!completed.length) return "";
    return (
      '<div class="list-row" id="completed-toggle" tabindex="0" role="button" aria-expanded="false" style="cursor:pointer;">' +
        '<div class="lr-lead" style="color:var(--brand);">' + ICONS.check + '</div>' +
        '<div class="lr-body"><strong>' + completed.length + ' concluído' + (completed.length === 1 ? "" : "s") + '</strong><span class="lr-meta">Revisados esta semana</span></div>' +
        '<div class="lr-actions"><span style="font-size:12.5px;color:var(--brand);font-weight:600;">Ver concluídos</span></div>' +
      '</div>' +
      '<div id="completed-list" style="display:none;">' + completed.map(function (c) {
        var u = Trackly.studentUpdate(c), color = TracklyNav.colorFor(c);
        return '<div class="list-row"><span class="avatar lr-lead" style="background:' + color + '">' + c.initials + '</span>' +
          '<div class="lr-body"><strong>' + c.name + '</strong><span class="lr-meta">' + ICONS.check + ' ' + (u.completedAtLabel || "Acompanhamento concluído") + '</span></div>' +
          '<div class="lr-actions"><a href="cliente.html?id=' + c.id + '" class="btn btn-secondary">Ver</a></div></div>';
      }).join("") + '</div>'
    );
  }

  function wireCompletedToggle() {
    var ct = document.getElementById("completed-toggle");
    if (!ct) return;
    function toggle() {
      var list = document.getElementById("completed-list");
      var open = list.style.display !== "none";
      list.style.display = open ? "none" : "block";
      ct.setAttribute("aria-expanded", String(!open));
      ct.querySelector(".lr-actions span").textContent = open ? "Ver concluídos" : "Ocultar";
    }
    ct.addEventListener("click", toggle);
    ct.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  }

  render();
})();
</script>
</body>
</html>
