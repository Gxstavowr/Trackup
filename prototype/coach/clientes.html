<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .add-panel { display: none; margin-bottom: 20px; }
  .add-panel.open { display: block; }
  .add-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .add-grid .field { margin-bottom: 0; }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="shell">
  <div id="shell-sidebar"></div>
  <main class="main">
    <div class="main-inner">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <div class="page-head">
        <div>
          <p class="eyebrow">Clientes</p>
          <h1>Meus clientes</h1>
          <p id="count-sub"></p>
        </div>
        <button class="btn btn-primary" id="add-toggle">+ Adicionar aluno</button>
      </div>

      <div class="card card-pad add-panel" id="add-panel">
        <p class="card-title" style="margin-bottom:14px;">Adicionar novo aluno</p>
        <div class="add-grid">
          <div class="field"><label>Nome</label><input type="text" id="new-name" placeholder="Nome completo"></div>
          <div class="field"><label>E-mail</label><input type="text" id="new-email" placeholder="email@exemplo.com"></div>
          <div class="field"><label>Telefone</label><input type="text" id="new-phone" placeholder="(00) 00000-0000"></div>
        </div>
        <button class="btn btn-primary" id="create-client">Criar aluno</button>
        <button class="btn btn-ghost" id="cancel-add">Cancelar</button>
      </div>

      <div class="filter-bar">
        <button class="chip-filter active" data-filter="all">Todos</button>
        <button class="chip-filter" data-filter="review">Aguardando revisão</button>
        <button class="chip-filter" data-filter="late">Atrasados</button>
        <button class="chip-filter" data-filter="warn">Atenção</button>
        <button class="chip-filter" data-filter="ok">Em dia</button>
        <input class="search-input" id="search" type="text" placeholder="Buscar por nome...">
      </div>

      <div class="card" id="roster-card" style="overflow-x:auto;">
        <table class="roster" style="min-width:600px;">
          <thead>
            <tr><th>Cliente</th><th>Objetivo</th><th>Status</th><th>Último check-in</th><th>Próxima ação</th></tr>
          </thead>
          <tbody id="roster-body"></tbody>
        </table>
      </div>
      <div id="empty" class="empty-state" style="display:none;">
        <h3>Nenhum cliente encontrado</h3>
        <p>Tente outro filtro ou termo de busca.</p>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/storage.js?v=6"></script>
<script src="../assets/js/data.js?v=6"></script>
<script src="../assets/js/icons.js?v=6"></script>
<script src="../assets/js/charts.js?v=6"></script>
<script src="../assets/js/nav.js?v=6"></script>
<script>
(function () {
  TracklyNav.mountCoachShell("clientes");
  var state = { filter: "all", q: "" };

  document.getElementById("add-toggle").addEventListener("click", function () { document.getElementById("add-panel").classList.add("open"); });
  document.getElementById("cancel-add").addEventListener("click", function () { document.getElementById("add-panel").classList.remove("open"); });
  document.getElementById("create-client").addEventListener("click", function () {
    var name = document.getElementById("new-name").value.trim();
    if (!name) { document.getElementById("new-name").focus(); return; }
    Trackly.createClient({ name: name, email: document.getElementById("new-email").value.trim(), phone: document.getElementById("new-phone").value.trim() });
    document.getElementById("new-name").value = ""; document.getElementById("new-email").value = ""; document.getElementById("new-phone").value = "";
    document.getElementById("add-panel").classList.remove("open");
    render();
  });

  var nextAction = {
    invite: null, // resolvido por linha, depende do inviteStatus
    review: ["Revisar check-in", "revisar.html?id="], late: ["Cobrar check-in", "cliente.html?id="],
    warn: ["Analisar tendência", "cliente.html?id="], ok: ["Nenhuma — tudo em dia", null]
  };

  function render() {
    var clients = Trackly.CLIENTS;
    document.getElementById("count-sub").textContent = clients.length + " cliente" + (clients.length === 1 ? "" : "s") + " no total.";

    var rows = clients.map(function (c) { return { c: c, s: Trackly.computeStatus(c) }; })
      .filter(function (x) { return state.filter === "all" || x.s.code === state.filter; })
      .filter(function (x) { return x.c.name.toLowerCase().indexOf(state.q.toLowerCase()) !== -1; });

    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    document.getElementById("roster-card").style.display = rows.length ? "block" : "none";

    document.getElementById("roster-body").innerHTML = rows.map(function (x) {
      var c = x.c, cur = c.weeks.length ? Trackly.currentWeek(c) : null;
      var pillClass = x.s.code === "ok" ? "pill-ok" : x.s.code === "late" ? "pill-late" : x.s.code === "invite" ? "pill-warn" : "pill-warn";
      var clickable = !!cur;
      var actionHtml;
      if (x.s.code === "invite") {
        if (c.inviteStatus === "pending") {
          actionHtml = '<a href="#" data-send-invite="' + c.id + '" style="color:var(--brand);font-weight:600;font-size:13px;">Enviar convite</a>';
        } else {
          actionHtml = '<a href="../convite.html?id=' + c.id + '" style="color:var(--brand);font-weight:600;font-size:13px;">Simular aceitação</a>';
        }
      } else {
        var action = nextAction[x.s.code];
        actionHtml = action[1] ? '<a href="' + action[1] + c.id + '" onclick="event.stopPropagation();" style="color:var(--brand);font-weight:600;font-size:13px;">' + action[0] + '</a>' : '<span style="color:var(--ink-faint);font-size:13px;">' + action[0] + '</span>';
      }
      return (
        '<tr' + (clickable ? ' onclick="location.href=\'cliente.html?id=' + c.id + '\'"' : ' style="cursor:default;"') + '>' +
        '<td><div class="client-cell"><span class="avatar" style="background:' + TracklyNav.colorFor(c) + '">' + c.initials + '</span><div class="name">' + c.name + '</div></div></td>' +
        '<td>' + c.objective + '</td>' +
        '<td><span class="pill ' + pillClass + '"><span class="dot"></span>' + x.s.label + '</span></td>' +
        '<td class="mono">' + (cur && cur.checkin.status === "submitted" ? Trackly.fmtShort(cur.end) : "—") + '</td>' +
        '<td>' + actionHtml + '</td>' +
        '</tr>'
      );
    }).join("");

    document.querySelectorAll("[data-send-invite]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        Trackly.sendInvite(a.getAttribute("data-send-invite"));
        render();
      });
    });
  }

  document.querySelectorAll(".chip-filter").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".chip-filter").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.filter = btn.getAttribute("data-filter");
      render();
    });
  });
  document.getElementById("search").addEventListener("input", function (e) { state.q = e.target.value; render(); });

  render();
})();
</script>
</body>
</html>
