<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamentos — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css?v=15">
<link rel="stylesheet" href="../assets/css/portal.css?v=15">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A09">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trackly">
<style>
  .pg-head { padding: 2px 0 4px; }
  .pg-head h1 { font-family: var(--font-display); font-size: clamp(1.25rem, 1.05rem + 1vw, 1.5rem); margin: 6px 0 6px; font-weight: 600; }
  .plan-summary { text-align: center; padding: 8px 0 4px; }
  .plan-summary .name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .plan-summary .price { font-family: var(--font-display); font-size: clamp(1.5rem, 1.3rem + 1vw, 2rem); font-weight: 600; }
  .plan-summary .period { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 14px; }
  .hist-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist-row:last-child { border-bottom: none; }
  .hist-row .d { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-faint); width: 74px; flex: none; }
  .hist-row .v { flex: 1; font-size: 14px; font-weight: 600; }
  .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 18px; }
  .method-opt { border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 12px 6px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink-muted); cursor: pointer; }
  .method-opt.sel { border-color: var(--brand); background: var(--brand-tint); color: var(--brand); }
  .paid-check { text-align: center; padding: 20px 10px 6px; }
  .paid-check .icon { width: clamp(40px, 12vw, 48px); height: clamp(40px, 12vw, 48px); border-radius: 50%; background: var(--brand-tint); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="portal">
  <div class="portal-top" id="shell-portal-top"></div>
  <div class="portal-inner">
    <a href="conta.html" id="back-link" class="btn-ghost btn" style="padding-left:2px;margin-bottom:6px;">&larr; Conta</a>
    <div class="pg-head">
      <p class="eyebrow">Pagamentos</p>
      <h1>Seu plano</h1>
    </div>

    <div class="card card-pad" style="margin-bottom:24px;" id="plan-card"></div>

    <div class="section-label">Histórico de pagamentos</div>
    <div class="card card-pad" id="hist-card"></div>
  </div>
  <div id="shell-bottom-nav"></div>
</div>

<script src="../assets/js/storage.js?v=13"></script>
<script src="../assets/js/data.js?v=16"></script>
<script src="../assets/js/icons.js?v=12"></script>
<script src="../assets/js/charts.js?v=13"></script>
<script src="../assets/js/nav.js?v=14"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var client = Trackly.getClient(params.get("client") || "joao");
  TracklyNav.mountPortalNav("conta", client.id);
  document.getElementById("back-link").href = "conta.html?client=" + client.id;

  var statusLabel = { paid: "Pago", pending: "Pendente", overdue: "Atrasado", cancelled: "Cancelado", refunded: "Estornado" };
  var statusPill = { paid: "pill-ok", pending: "pill-warn", overdue: "pill-late", cancelled: "pill", refunded: "pill" };
  // situação da ASSINATURA (TODO §22) — só leitura aqui; quem define é o coach em cliente.html.
  var subStatusLabel = { active: "Ativa", paused: "Pausada", cancelled: "Cancelada" };
  var methodLabel = { pix: "PIX", cartao: "Cartão", boleto: "Boleto" };
  var selectedMethod = "pix";

  function fmtMoney(cents) { return (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function periodLabel(p) { return { monthly: "mensal", quarterly: "trimestral", semiannual: "semestral", annual: "anual" }[p] || p; }

  function renderPlanCard() {
    // aluno recém-aceito pode ainda não ter plano cadastrado pelo coach — estado vazio em vez de
    // presumir client.plan/pay sempre presentes (TODO §34).
    if (!client.plan) {
      document.getElementById("plan-card").innerHTML = '<div class="empty-state" style="padding:20px 4px;"><h3 style="font-size:15px;">Nenhum plano cadastrado</h3><p>Seu coach ainda não configurou sua assinatura — volte aqui assim que ela estiver pronta.</p></div>';
      return;
    }
    var pay = Trackly.currentPayment(client);
    if (!pay) {
      document.getElementById("plan-card").innerHTML =
        '<div class="plan-summary">' +
          '<div class="name">' + client.plan.name + '</div>' +
          '<div class="price">' + fmtMoney(client.plan.priceCents) + '</div>' +
          '<div class="period">cobrança ' + periodLabel(client.plan.period) + '</div>' +
        '</div>';
      return;
    }
    var needsPay = pay.status === "pending" || pay.status === "overdue";
    document.getElementById("plan-card").innerHTML =
      '<div class="plan-summary">' +
        '<div class="name">' + client.plan.name + '</div>' +
        '<div class="price">' + fmtMoney(client.plan.priceCents) + '</div>' +
        '<div class="period">cobrança ' + periodLabel(client.plan.period) + '</div>' +
        '<span class="pill ' + statusPill[pay.status] + '"><span class="dot"></span>' + statusLabel[pay.status] + '</span>' +
        '<p style="font-size:12px;color:var(--ink-faint);margin:10px 0 0;">Assinatura: ' + (subStatusLabel[client.subscriptionStatus] || client.subscriptionStatus || "Ativa") + '</p>' +
      '</div>' +
      (needsPay ? (
        '<div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--line);">' +
          '<p style="font-size:12.5px;color:var(--ink-muted);margin:0 0 10px;text-align:center;">Vencimento: ' + Trackly.fmtShort(pay.dueDate) + '</p>' +
          '<div class="method-grid" id="method-grid">' +
            ["pix", "cartao", "boleto"].map(function (m) { return '<div class="method-opt' + (m === selectedMethod ? " sel" : "") + '" data-method="' + m + '">' + methodLabel[m] + '</div>'; }).join("") +
          '</div>' +
          '<button class="btn btn-primary btn-block btn-lg" id="pay-btn">Pagar agora</button>' +
        '</div>'
      ) : '') +
      (pay.status === "overdue" ? '<p style="font-size:12px;color:var(--ink-faint);text-align:center;margin-top:12px;">Simulado — nenhuma cobrança real é feita neste protótipo.</p>' : (needsPay ? '<p style="font-size:12px;color:var(--ink-faint);text-align:center;margin-top:12px;">Simulado — nenhuma cobrança real é feita neste protótipo.</p>' : ''));

    if (needsPay) {
      document.querySelectorAll("#method-grid .method-opt").forEach(function (opt) {
        opt.addEventListener("click", function () {
          selectedMethod = opt.getAttribute("data-method");
          document.querySelectorAll("#method-grid .method-opt").forEach(function (o) { o.classList.toggle("sel", o === opt); });
        });
      });
      document.getElementById("pay-btn").addEventListener("click", function () {
        Trackly.simulatePayment(client.id, selectedMethod);
        document.getElementById("plan-card").innerHTML =
          '<div class="paid-check"><div class="icon">' + ICONS.check + '</div><h2 style="font-family:var(--font-display);font-size:18px;margin:0 0 6px;">Pagamento confirmado!</h2>' +
          '<p style="font-size:13px;color:var(--ink-muted);margin:0;">Seu plano está em dia.</p></div>';
        setTimeout(function () { renderPlanCard(); renderHistory(); }, 1400);
      });
    }
  }

  function renderHistory() {
    var rows = (client.paymentsHistory || []).slice().reverse();
    document.getElementById("hist-card").innerHTML = rows.length ? rows.map(function (p) {
      return '<div class="hist-row"><span class="d">' + Trackly.fmtShort(p.dueDate) + '</span><span class="v">' + fmtMoney(p.amountCents) + '</span><span class="pill ' + statusPill[p.status] + '"><span class="dot"></span>' + statusLabel[p.status] + '</span></div>';
    }).join("") : '<div class="empty-state" style="padding:24px 4px;"><h3 style="font-size:15px;">Nenhum pagamento ainda</h3></div>';
  }

  renderPlanCard();
  renderHistory();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }
</script>
</body>
</html>
