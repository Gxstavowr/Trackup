<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolução — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .journey-card { text-align: center; padding: 6px 0 20px; }
  .journey-card .weeks { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; letter-spacing: .03em; margin-bottom: 14px; }
  .journey-row { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .journey-row .item .l { font-size: 11.5px; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
  .journey-row .item .v { font-family: var(--font-mono); font-size: 15px; }
  .journey-row .item .v strong { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin-left: 5px; }
  .period-card { background: var(--brand-tint); border: 1px solid var(--brand-tint-strong); border-radius: var(--radius-lg); padding: 20px; }
  .period-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 10px; margin: 14px 0 16px; }
  .period-stats .item .l { font-size: 11px; color: var(--ink-faint); font-weight: 600; margin-bottom: 3px; }
  .period-stats .item .v { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .period-narrative { font-size: 13.5px; line-height: 1.6; color: var(--ink); border-top: 1px solid var(--brand-tint-strong); padding-top: 14px; margin: 0; }
  .period-narrative strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--brand); margin-bottom: 6px; font-weight: 700; }
  .compare-select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font-size: 12.5px; font-family: var(--font-body); }
</style>
</head>
<body data-root="../">
<div id="shell-demo"></div>
<div class="portal">
  <div class="portal-top" id="shell-portal-top"></div>
  <div class="portal-inner">
    <div class="page-head" style="margin-bottom:6px;">
      <div><p class="eyebrow">Evolução</p><h1 style="font-size:22px;">Sua jornada até aqui</h1></div>
    </div>

    <div class="journey-card" id="journey"></div>

    <div class="range-sel" id="range-sel" style="margin-bottom:16px;"></div>

    <div style="margin-bottom:28px;" id="weight-chart-card">
      <div id="weight-hero" style="margin-bottom:16px;"></div>
      <div id="chart-weight"></div>
    </div>
    <div style="margin-bottom:22px;" id="waist-card"></div>
    <div style="margin-bottom:22px;">
      <p class="section-label">Aderência</p>
      <div id="chart-adherence"></div>
    </div>

    <div class="section-h"><h2>Evolução visual</h2></div>
    <div id="compare-card" style="margin-bottom:16px;"></div>

    <button class="disclosure-btn" id="more-toggle" style="margin:18px 0 0;"></button>
    <div class="disclosure-panel" id="more-panel" style="margin-top:14px;">
      <div style="margin-bottom:22px;" id="sleep-chart-card">
        <p class="section-label">Sono (h)</p>
        <div id="chart-sleep"></div>
      </div>
      <div style="margin-bottom:22px;" id="water-chart-card">
        <p class="section-label">Água (L)</p>
        <div id="chart-water"></div>
      </div>
      <div style="margin-bottom:22px;">
        <p class="section-label">Treinos realizados vs. meta</p>
        <div id="chart-workouts"></div>
      </div>
      <div id="cardio-chart-card">
        <p class="section-label">Cardio realizado vs. meta</p>
        <div id="chart-cardio"></div>
      </div>
    </div>

    <div class="section-h"><h2>Resumo do período</h2></div>
    <div id="period-summary"></div>
  </div>
  <div id="shell-bottom-nav"></div>
</div>

<script src="../assets/js/storage.js?v=7"></script>
<script src="../assets/js/data.js?v=7"></script>
<script src="../assets/js/icons.js?v=7"></script>
<script src="../assets/js/charts.js?v=7"></script>
<script src="../assets/js/nav.js?v=7"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var client = Trackly.getClient(params.get("client") || "joao");
  TracklyNav.mountPortalNav("evolucao", client.id);
  var color = TracklyNav.colorFor(client);
  var state = { range: "12" };

  var kpi = Trackly.computeKPIs(client);
  var journeyItems = [
    { l: "Peso", v: kpi.weightStart + "kg", now: kpi.weightNow + "kg" },
    kpi.waistNow != null ? { l: "Cintura", v: kpi.waistStart + "cm", now: kpi.waistNow + "cm" } : null,
    { l: "Aderência média", now: kpi.adherenceAvg + "%" }
  ].filter(Boolean);
  document.getElementById("journey").innerHTML =
    '<div class="weeks">' + kpi.weeksElapsed + ' SEMANAS DE ACOMPANHAMENTO</div>' +
    '<div class="journey-row">' + journeyItems.map(function (it) {
      return '<div class="item"><div class="l">' + it.l + '</div><div class="v">' + (it.v ? it.v + ' →' : '') + '<strong>' + it.now + '</strong></div></div>';
    }).join("") + '</div>';

  function render() {
    var weeks = Trackly.weeksInRange(client, state.range);
    document.getElementById("range-sel").innerHTML = [["4", "4 sem"], ["8", "8 sem"], ["12", "12 sem"], ["all", "tudo"]].map(function (r) {
      return '<button data-r="' + r[0] + '" class="' + (state.range === r[0] ? "active" : "") + '">' + r[1] + '</button>';
    }).join("");
    document.querySelectorAll("#range-sel button").forEach(function (b) {
      b.addEventListener("click", function () { state.range = b.getAttribute("data-r"); render(); });
    });

    var lastW = weeks[weeks.length - 1], prevW = weeks.length > 1 ? weeks[weeks.length - 2] : null;
    var wkDelta = prevW ? Trackly.round1(lastW.metrics.weight - prevW.metrics.weight) : 0;
    document.getElementById("weight-hero").innerHTML =
      '<div class="hero-stat"><div class="value">' + lastW.metrics.weight + '<span class="unit">kg</span></div>' +
      (prevW ? '<div class="delta" style="color:' + (Trackly.isGoodWeightDelta(client, wkDelta) ? "var(--brand)" : "var(--coral)") + ';">' + (wkDelta <= 0 ? "↓" : "↑") + ' ' + Math.abs(wkDelta) + 'kg esta semana</div>' : '') +
      '</div>' +
      (function () { var t = Trackly.trendLine(client); return t ? '<p style="font-size:13px;color:var(--ink-muted);margin:8px 0 0;">' + t + '</p>' : ""; })();
    document.getElementById("chart-weight").innerHTML = Charts.lineChart({
      data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.weight }; }),
      height: 260, color: color, unit: "kg", maxXLabels: 6
    });

    if (client.weeks[0].metrics.waist != null) {
      document.getElementById("waist-card").style.display = "block";
      document.getElementById("waist-card").innerHTML =
        '<p class="section-label">Cintura</p>' +
        Charts.lineChart({ data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.waist }; }), height: 190, color: "var(--c3)", unit: "cm", maxXLabels: 5 });
    } else {
      document.getElementById("waist-card").style.display = "none";
    }

    document.getElementById("chart-adherence").innerHTML = Charts.lineChart({
      data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.adherence }; }),
      height: 190, color: "var(--gold)", unit: "%", min: 0, max: 100
    });

    document.getElementById("sleep-chart-card").style.display = Trackly.isTracked(client, "sleep") ? "block" : "none";
    if (Trackly.isTracked(client, "sleep")) {
      document.getElementById("chart-sleep").innerHTML = Charts.lineChart({
        data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.sleep }; }),
        height: 170, color: "var(--c4)", unit: "h"
      });
    }
    document.getElementById("water-chart-card").style.display = Trackly.isTracked(client, "water") ? "block" : "none";
    if (Trackly.isTracked(client, "water")) {
      document.getElementById("chart-water").innerHTML = Charts.lineChart({
        data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.water }; }),
        height: 170, color: "var(--c4)", unit: "L"
      });
    }
    document.getElementById("chart-workouts").innerHTML = Charts.barChart({
      data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.workouts, goal: w.metrics.workoutsGoal }; }),
      height: 170
    });
    document.getElementById("cardio-chart-card").style.display = Trackly.isTracked(client, "cardio") ? "block" : "none";
    if (Trackly.isTracked(client, "cardio")) {
      document.getElementById("chart-cardio").innerHTML = Charts.barChart({
        data: weeks.map(function (w) { return { label: "S" + w.weekNumber, value: w.metrics.cardio, goal: w.metrics.cardioGoal }; }),
        height: 170
      });
    }

    // resumo do período — mesmo período selecionado acima, nunca uma janela fixa própria (brief V8 §9-11)
    var period = Trackly.buildPeriodSummary(client, state.range);
    document.getElementById("period-summary").innerHTML = !period
      ? '<div class="card card-pad"><p style="margin:0;font-size:13.5px;color:var(--ink-faint);">Ainda não há semanas suficientes para um resumo de período — volte daqui a algumas semanas.</p></div>'
      : (
        '<div class="period-card">' +
        '<div class="weeks" style="text-align:left;margin-bottom:0;">' + period.weeksCount + ' SEMANAS SELECIONADAS</div>' +
        '<div class="period-stats">' +
          '<div class="item"><div class="l">Peso</div><div class="v">' + (period.weightDelta > 0 ? "+" : "") + period.weightDelta + 'kg</div></div>' +
          (period.waistDelta != null ? '<div class="item"><div class="l">Cintura</div><div class="v">' + (period.waistDelta > 0 ? "+" : "") + period.waistDelta + 'cm</div></div>' : '<div class="item"><div class="l">Aderência</div><div class="v">' + period.adherenceAvg + '%</div></div>') +
          '<div class="item"><div class="l">Treinos</div><div class="v">' + period.workoutsTotal + '/' + period.workoutsGoalTotal + '</div></div>' +
          (Trackly.isTracked(client, "sleep") ? '<div class="item"><div class="l">Sono médio</div><div class="v">' + period.sleepAvg + 'h</div></div>' : "") +
        '</div>' +
        '<p class="period-narrative"><strong>O que mudou</strong>' + period.narrative + '</p>' +
        '</div>'
      );
  }
  render();

  document.getElementById("more-toggle").innerHTML = ICONS.chevronR + "<span>Ver mais métricas</span>";
  document.getElementById("more-toggle").addEventListener("click", function () {
    this.classList.toggle("open");
    document.getElementById("more-panel").classList.toggle("open");
    this.querySelector("span").textContent = this.classList.contains("open") ? "Ocultar métricas" : "Ver mais métricas";
  });

  var hue = client.colorVar === "--c1" ? 155 : client.colorVar === "--c2" ? 32 : client.colorVar === "--c3" ? 265 : 205;
  function photoBg(i) { return "hsl(" + hue + "," + (26 + i * 6) + "%," + (30 + i * 10) + "%)"; }

  var submittedWeeks = client.weeks.filter(function (w) { return w.checkin.status === "submitted"; });
  var compareState = { a: submittedWeeks[0].weekNumber, b: submittedWeeks[submittedWeeks.length - 1].weekNumber };
  function renderCompare() {
    if (submittedWeeks.length < 2) {
      document.getElementById("compare-card").innerHTML = '<p style="margin:0;font-size:13px;color:var(--ink-faint);">Ainda não há semanas suficientes pra comparar.</p>';
      return;
    }
    var options = submittedWeeks.map(function (w) { return w.weekNumber; });
    function optHtml(sel) { return options.map(function (v) { return '<option value="' + v + '"' + (v === sel ? " selected" : "") + '>Semana ' + v + '</option>'; }).join(""); }

    var wA = client.weeks[compareState.a - 1], wB = client.weeks[compareState.b - 1];
    var weightDiff = Trackly.round1(wB.metrics.weight - wA.metrics.weight);
    var metaItems = [
      Trackly.isTracked(client, "weight") ? { l: "Peso", from: wA.metrics.weight + " kg", to: wB.metrics.weight + " kg", pct: Trackly.round1(100 * weightDiff / wA.metrics.weight) } : null,
      Trackly.isTracked(client, "measurements") && wA.metrics.waist != null ? { l: "Cintura", from: wA.metrics.waist + " cm", to: wB.metrics.waist + " cm", pct: Trackly.round1(100 * (wB.metrics.waist - wA.metrics.waist) / wA.metrics.waist) } : null,
      Trackly.isTracked(client, "adherence") ? { l: "Aderência", from: wA.metrics.adherence + "%", to: wB.metrics.adherence + "%", pct: Trackly.round1(wB.metrics.adherence - wA.metrics.adherence) } : null
    ].filter(Boolean);

    document.getElementById("compare-card").innerHTML =
      '<div style="display:flex;gap:10px;margin-bottom:14px;">' +
        '<select class="compare-select" data-side="a">' + optHtml(compareState.a) + '</select>' +
        '<select class="compare-select" data-side="b">' + optHtml(compareState.b) + '</select>' +
      '</div>' +
      '<div class="compare-slider" id="cs-photo">' +
        '<div class="cs-after" style="background:' + photoBg(1) + ';"><span class="cs-tag after">Agora · S' + compareState.b + '</span></div>' +
        '<div class="cs-before" id="cs-before-clip" style="width:50%;"><div style="background:' + photoBg(0) + ';"><span class="cs-tag before">Antes · S' + compareState.a + '</span></div></div>' +
        '<div class="cs-handle" id="cs-handle" tabindex="0" role="slider" aria-label="Comparar antes e depois" aria-valuemin="4" aria-valuemax="96" aria-valuenow="50" style="left:50%;"></div>' +
      '</div>' +
      '<div class="compare-meta">' + metaItems.map(function (m) {
        return '<div class="cm-item"><div class="l">' + m.l + '</div><div class="v">' + m.from + ' → ' + m.to + '</div><div style="color:' + (m.pct <= 0 ? "var(--brand)" : "var(--coral)") + ';font-weight:600;">' + (m.pct > 0 ? "+" : "") + m.pct + '%</div></div>';
      }).join("") + '</div>';

    wireCompareInteraction();
    document.querySelectorAll(".compare-select").forEach(function (sel) {
      sel.addEventListener("change", function () { compareState[sel.getAttribute("data-side")] = parseInt(sel.value, 10); renderCompare(); });
    });
  }
  function wireCompareInteraction() {
    var wrap = document.getElementById("cs-photo");
    var handle = document.getElementById("cs-handle");
    var clip = document.getElementById("cs-before-clip");
    var fullWidth = wrap.getBoundingClientRect().width;
    clip.firstElementChild.style.width = fullWidth + "px";
    var dragging = false;
    function setPct(pct) {
      pct = Math.max(4, Math.min(96, pct));
      clip.style.width = pct + "%";
      handle.style.left = pct + "%";
      handle.setAttribute("aria-valuenow", Math.round(pct));
    }
    function setPctFromX(clientX) {
      var rect = wrap.getBoundingClientRect();
      setPct(((clientX - rect.left) / rect.width) * 100);
    }
    handle.addEventListener("pointerdown", function (e) { dragging = true; handle.setPointerCapture(e.pointerId); });
    handle.addEventListener("pointermove", function (e) { if (dragging) setPctFromX(e.clientX); });
    handle.addEventListener("pointerup", function () { dragging = false; });
    handle.addEventListener("keydown", function (e) {
      var cur = parseFloat(handle.style.left) || 50;
      if (e.key === "ArrowLeft") { e.preventDefault(); setPct(cur - 5); }
      else if (e.key === "ArrowRight") { e.preventDefault(); setPct(cur + 5); }
    });
    wrap.addEventListener("click", function (e) { if (e.target === wrap || e.target.classList.contains("cs-after")) setPctFromX(e.clientX); });
  }
  renderCompare();
})();
</script>
</body>
</html>
