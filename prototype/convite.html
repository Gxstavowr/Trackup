<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite — Trackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .invite-card { max-width: 380px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--surface-raised-shadow); padding: 34px 30px; text-align: center; }
  .invite-card .avatar { width: 52px; height: 52px; font-size: 19px; margin: 0 auto 18px; }
  .invite-card h1 { font-family: var(--font-display); font-size: 21px; margin: 0 0 10px; font-weight: 600; line-height: 1.3; }
  .invite-card p { font-size: 13.5px; color: var(--ink-muted); line-height: 1.55; margin: 0 0 26px; }
  .invite-card .ring { width: 60px; height: 60px; border-radius: 50%; background: var(--brand-tint); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
</style>
</head>
<body data-root="">
<div id="shell-demo" style="position:fixed;top:0;left:0;right:0;"></div>
<div class="invite-card" id="card"></div>

<script src="assets/js/storage.js?v=8"></script>
<script src="assets/js/data.js?v=8"></script>
<script src="assets/js/icons.js?v=8"></script>
<script src="assets/js/nav.js?v=8"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var client = Trackly.getClient(params.get("id") || "");
  document.getElementById("shell-demo").innerHTML = '<div class="demo-bar"><strong>Modo demonstração</strong><span>·</span><a href="coach/clientes.html">voltar pra clientes</a></div>';

  if (!client || client.id !== params.get("id")) {
    document.getElementById("card").innerHTML = '<h1>Convite não encontrado</h1><p>Esse link de convite não é válido.</p><a href="coach/clientes.html" class="btn btn-secondary">Voltar</a>';
    return;
  }

  function renderPending() {
    document.getElementById("card").innerHTML =
      '<span class="avatar" style="background:' + TracklyNav.colorFor(client) + '">' + client.initials + '</span>' +
      '<h1>' + Trackly.COACH.name + ' convidou você para participar do seu acompanhamento.</h1>' +
      '<p>Ao aceitar, ' + Trackly.COACH.name.split(" ")[0] + ' poderá acompanhar seus check-ins semanais, orientações e evolução — tudo em um só lugar.</p>' +
      '<button class="btn btn-primary btn-lg btn-block" id="accept">Aceitar convite</button>';
    document.getElementById("accept").addEventListener("click", function () {
      Trackly.acceptInvite(client.id);
      renderActive();
    });
  }

  function renderActive() {
    document.getElementById("card").innerHTML =
      '<div class="ring">' + ICONS.check + '</div>' +
      '<h1>Conta ativada</h1>' +
      '<p>Você agora está conectado(a) com ' + Trackly.COACH.name + '. Seu primeiro check-in já foi registrado — em breve você recebe sua orientação da semana.</p>' +
      '<a href="portal/dashboard.html?client=' + client.id + '" class="btn btn-primary btn-lg btn-block">Ir para o meu painel</a>';
  }

  if (client.inviteStatus === "active") renderActive(); else renderPending();
})();
</script>
</body>
</html>
